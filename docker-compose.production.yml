name: aihub-production

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ${AIHUB_IMAGE:-aihub-be:local}
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 150
  mem_limit: 768m
  cpus: 1.5
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  networks:
    - backend

x-app-database-networks: &app-database-networks
  - backend
  - aihub-database

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: "3000"
  OTEL_SERVICE_NAME: aihub-be
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  AIHUB_ALLOW_UNAUTHENTICATED_DEV: "false"
  AIHUB_RUNTIME_SECRET_SOURCE: agent-file
  AIHUB_RUNTIME_SECRETS_FILE: /run/secrets/aihub/runtime-secrets.json
  AIHUB_AUTH_MFA_SECRETS_FILE: ${AIHUB_AUTH_MFA_SECRETS_FILE:?AIHUB_AUTH_MFA_SECRETS_FILE is required}
  AIHUB_RUNTIME_CONNECTION_SECRETS_FILE: /run/secrets/aihub/connection-secrets.json
  # Deploy-time gate for the Web Session routes. The runtime value AIHUB
  # compares against comes from the Vault `web-session` bundle.
  AIHUB_RUNTIME_DATABASE_SCOPE: production
  AIHUB_USER_ACCESS_ISSUER: ${AIHUB_USER_ACCESS_ISSUER:?AIHUB_USER_ACCESS_ISSUER is required}
  AIHUB_PRODUCTION_HOST: ${AIHUB_PRODUCTION_HOST:?AIHUB_PRODUCTION_HOST is required}
  AIHUB_STAGING_HOST: ${AIHUB_STAGING_HOST:-}
  AIHUB_DEVELOPMENT_HOST: ${AIHUB_DEVELOPMENT_HOST:-}
  AIHUB_SANDBOX_HOST: ${AIHUB_SANDBOX_HOST:-}
  AIHUB_SELF_SERVE_MONTHLY_REQUEST_QUOTA: ${AIHUB_SELF_SERVE_MONTHLY_REQUEST_QUOTA:-}
  DOWNSTREAM_AI_WRITING_URL: ${DOWNSTREAM_AI_WRITING_URL:?DOWNSTREAM_AI_WRITING_URL is required}
  DOWNSTREAM_AI_SPEAKING_URL: ${DOWNSTREAM_AI_SPEAKING_URL:?DOWNSTREAM_AI_SPEAKING_URL is required}
  RESEND_FROM: ${RESEND_FROM:?RESEND_FROM is required}
  CUSTOMER_WEB_BASE_URL: ${CUSTOMER_WEB_BASE_URL:?CUSTOMER_WEB_BASE_URL is required}
  # Optional: unset leaves the Avatar routes answering 503 (ADR-0068).
  SEAWEEDFS_USER_ASSET_BUCKET: ${SEAWEEDFS_USER_ASSET_BUCKET:-}
  # Do not set until WISPACE confirms the dedicated private Audio bucket.
  SEAWEEDFS_AUDIO_ASSET_BUCKET: ${SEAWEEDFS_AUDIO_ASSET_BUCKET:-}

x-app-service: &app-service
  <<: *app-common
  networks: *app-database-networks
  restart: unless-stopped
  stop_grace_period: 90s
  volumes:
    - ${AIHUB_RUNTIME_SECRETS_HOST_DIR:?AIHUB_RUNTIME_SECRETS_HOST_DIR is required}:/run/secrets/aihub:ro
  depends_on:
    vault-agent:
      condition: service_healthy
  healthcheck: &app-healthcheck
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
    interval: 10s
    timeout: 5s
    start_period: 20s
    retries: 12

services:
  vault-agent:
    image: ${VAULT_IMAGE:-hashicorp/vault:1.21.4}
    restart: unless-stopped
    command:
      - agent
      - -config=/etc/aihub/vault/agent.hcl
      - -log-level=info
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      AIHUB_VAULT_ENVIRONMENT: production
      VAULT_ADDR: ${VAULT_ADDR:?VAULT_ADDR is required}
      VAULT_CACERT: /etc/aihub/vault/ca.pem
      SKIP_CHOWN: "true"
      SKIP_SETCAP: "true"
    volumes:
      - ${VAULT_ROLE_ID_FILE:?VAULT_ROLE_ID_FILE is required}:/run/secrets/vault/role_id:ro
      - ${VAULT_CA_CERT_FILE:?VAULT_CA_CERT_FILE is required}:/etc/aihub/vault/ca.pem:ro
      - ./ops/vault/agent/aihub-runtime.hcl:/etc/aihub/vault/agent.hcl:ro
      - ./ops/vault/templates/runtime-secrets.json.ctmpl:/etc/aihub/vault/runtime-secrets.json.ctmpl:ro
      - ./ops/vault/templates/auth-mfa-secrets.json.ctmpl:/etc/aihub/vault/auth-mfa-secrets.json.ctmpl:ro
      - ./ops/vault/templates/connection-secrets.json.ctmpl:/etc/aihub/vault/connection-secrets.json.ctmpl:ro
      - ${AIHUB_RUNTIME_SECRETS_HOST_DIR:?AIHUB_RUNTIME_SECRETS_HOST_DIR is required}:/run/secrets/aihub
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - |-
          test -s /run/secrets/aihub/runtime-secrets.json || { echo 'vault-agent unhealthy: runtime-secrets.json is missing or empty'; exit 1; }
          test -s /run/secrets/aihub/auth-mfa-secrets.json || { echo 'vault-agent unhealthy: auth-mfa-secrets.json is missing or empty'; exit 1; }
          test -s /run/secrets/aihub/connection-secrets.json || { echo 'vault-agent unhealthy: connection-secrets.json is missing or empty'; exit 1; }
          wget -q -T 2 -O /dev/null 'http://127.0.0.1:8220/agent/v1/metrics?format=prometheus' || { echo 'vault-agent unhealthy: metrics endpoint unavailable'; exit 1; }
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 3

  migrate:
    <<: *app-common
    profiles:
      - migration
    entrypoint: ["node", "scripts/runtime/runtime-entrypoint.mjs"]
    command: ["scripts/cli/migrate.mjs"]
    environment: *app-environment
    networks: *app-database-networks
    volumes:
      - ${AIHUB_RUNTIME_SECRETS_HOST_DIR:?AIHUB_RUNTIME_SECRETS_HOST_DIR is required}:/run/secrets/aihub:ro
    depends_on:
      vault-agent:
        condition: service_healthy
    restart: "no"

  migrate-sandbox:
    <<: *app-common
    profiles:
      - migration
      - sandbox
    entrypoint: ["node", "scripts/runtime/runtime-entrypoint.mjs"]
    command: ["scripts/cli/migrate.mjs"]
    environment:
      <<: *app-environment
      AIHUB_RUNTIME_DATABASE_SCOPE: sandbox
    networks: *app-database-networks
    volumes:
      - ${AIHUB_RUNTIME_SECRETS_HOST_DIR:?AIHUB_RUNTIME_SECRETS_HOST_DIR is required}:/run/secrets/aihub:ro
    depends_on:
      vault-agent:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-service
    environment: *app-environment
    ports:
      - "127.0.0.1:${AIHUB_APP_PORT:-3021}:3000"

  app-slot-b:
    <<: *app-service
    profiles:
      - blue-green
    environment: *app-environment
    ports:
      - "127.0.0.1:3023:3000"

  app-sandbox:
    <<: *app-service
    profiles:
      - sandbox
    environment:
      <<: *app-environment
      AIHUB_RUNTIME_DATABASE_SCOPE: sandbox
      # Sandbox only: set on the production app, it enables the assertion mint
      # route there, and Production accepts what it mints (#442).
      AIHUB_SANDBOX_ORG_IDS: ${AIHUB_SANDBOX_ORG_IDS:-}
      CUSTOMER_WEB_BASE_URL: ${CUSTOMER_WEB_SANDBOX_BASE_URL:-}
      # Its own Avatar bucket: the records live in the Sandbox database, so a
      # shared bucket would make each deployment's sweep delete the other's
      # live Avatars. Unset leaves the Sandbox Avatar routes at 503 (ADR-0068).
      SEAWEEDFS_USER_ASSET_BUCKET: ${SEAWEEDFS_SANDBOX_USER_ASSET_BUCKET:-}
      # Set only after WISPACE confirms the dedicated private Sandbox bucket.
      SEAWEEDFS_AUDIO_ASSET_BUCKET: ${SEAWEEDFS_SANDBOX_AUDIO_ASSET_BUCKET:-}
    ports:
      - "127.0.0.1:${AIHUB_SANDBOX_APP_PORT:-3022}:3000"

  app-sandbox-slot-b:
    <<: *app-service
    profiles:
      - sandbox
      - blue-green
    environment:
      <<: *app-environment
      AIHUB_RUNTIME_DATABASE_SCOPE: sandbox
      AIHUB_SANDBOX_ORG_IDS: ${AIHUB_SANDBOX_ORG_IDS:-}
      CUSTOMER_WEB_BASE_URL: ${CUSTOMER_WEB_SANDBOX_BASE_URL:-}
      SEAWEEDFS_USER_ASSET_BUCKET: ${SEAWEEDFS_SANDBOX_USER_ASSET_BUCKET:-}
      SEAWEEDFS_AUDIO_ASSET_BUCKET: ${SEAWEEDFS_SANDBOX_AUDIO_ASSET_BUCKET:-}
    ports:
      - "127.0.0.1:3024:3000"

networks:
  backend:
  aihub-database:
    external: true
    name: ${AIHUB_DATABASE_NETWORK:-aihub_aihub-network}
