allowBuilds:
  "@biomejs/biome": true
  # Prisma's schema engine. The generated client is Rust-free (ADR-0088), but the
  # dev-dependency CLI still needs this binary for `db pull` and `migrate diff`,
  # and it runs only in the build stage and in CI - never in the runtime image.
  "@prisma/engines": true
  "@swc/core": true
  argon2: true
  esbuild: true
  prisma: true
  protobufjs: false

# Each override lifts a transitive dependency past an open advisory.
# Remove one once every package named in its comment declares the patched
# version itself.
overrides:
  # Forced by openapi-to-postmanv2, which pins 4.3.0 exactly.
  "js-yaml@>=4.0.0 <4.3.2": ^4.3.2
  # Forced by openapi-to-postmanv2, which pins 1.10.2 exactly.
  "yaml@>=1.0.0 <1.10.3": ^1.10.3
  # Forced by postman-collection, which pins 8.3.2 exactly. A major jump; the
  # committed Postman collection regenerates identically apart from its
  # random ids. Its faker 5.5.3 pin is deliberately not overridden: faker 10
  # removed the API postman-collection loads (ADR-0047).
  "uuid@<11.1.1": ^11.1.1
  # Forced by minimatch 3.1.5, which resolved the 1.x line to 1.1.18 and does
  # not move on its own. 1.1.21 is the first release past the advisories, and
  # minimatch 3 still accepts it (^1.1.7).
  "brace-expansion@<1.1.21": ^1.1.21
