groups:
  - name: aihub-host-and-container
    rules:
      - alert: AIHUBHostDiskAbove80Percent
        expr: 100 * (1 - node_filesystem_avail_bytes{job=~"aihub-(production|monitoring)-node",fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_size_bytes{job=~"aihub-(production|monitoring)-node",fstype!~"tmpfs|overlay|squashfs|ramfs"}) > 80
        for: 5m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "AIHUB host disk use is above 80%"
          description: "{{ $labels.host }} filesystem {{ $labels.mountpoint }} is above the 80% disk threshold."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#host-disk

      - alert: AIHUBHostMemoryPressure
        expr: node_memory_MemAvailable_bytes{job=~"aihub-(production|monitoring)-node"} / node_memory_MemTotal_bytes{job=~"aihub-(production|monitoring)-node"} < 0.10
        for: 5m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "AIHUB host has less than 10% memory available"
          description: "{{ $labels.host }} has less than 10% memory available for five minutes. Threshold is proposed pending #412 review."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#host-memory

      - alert: AIHUBContainerOOM
        expr: increase(container_oom_events_total{job="aihub-monitoring-containers",name=~"aihub.*"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
          owner: aihub-operations
        annotations:
          summary: "An AIHUB container reported an OOM event"
          description: "cAdvisor reports an OOM event for {{ $labels.name }} on the monitoring host. Production containers are covered by AIHUBContainerOOMKilled. Stopped-container history is not covered."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#containers

      - alert: AIHUBContainerRestartLoop
        expr: changes(container_start_time_seconds{job=~"aihub-(production|monitoring)-containers",name=~"aihub.*"}[10m]) > 2
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "An AIHUB container restarted more than twice in ten minutes"
          description: "Candidate rule: verify the deployed cAdvisor labels and restart behavior before enabling."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#containers

  - name: aihub-postgres-and-redis
    rules:
      - alert: AIHUBPostgresConnectionsAboveBudget
        expr: aihub_postgres_snapshot_value{job="aihub-postgres",metric="connections_total"} / on (instance, job) aihub_postgres_snapshot_value{job="aihub-postgres",metric="max_connections"} >= 0.80
        for: 5m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "Shared PostgreSQL connections reached 80% of max_connections"
          description: "Connection usage is at least 80% of max_connections, the threshold recorded in ADR-0103."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#postgresql

      - alert: AIHUBRedisMemoryAboveBound
        expr: redis_memory_used_bytes{job="aihub-redis"} > 214748365
        for: 5m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "AIHUB Redis used more than 80% of configured maxmemory"
          description: "Redis memory is above 80% of the observed 256 MiB maxmemory setting. Recheck the configured bound after Redis changes."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#redis

      - alert: AIHUBRedisCommandLatencyAboveBound
        expr: sum by (instance) (rate(redis_commands_duration_seconds_total{job="aihub-redis"}[5m])) / sum by (instance) (rate(redis_commands_total{job="aihub-redis"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "AIHUB Redis mean command latency exceeded 100 ms"
          description: "Candidate threshold pending Redis owner and #412 approval."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#redis

  - name: aihub-downstream
    rules:
      - alert: AIHUBDownstreamCircuitBreakerOpen
        expr: max by (job, environment, operation) (aihub_breaker_state{job=~"aihub-(production|sandbox)-app"} == 1)
        for: 2m
        labels:
          severity: warning
          owner: aihub-operations
          service: aihub
        annotations:
          summary: "An AIHUB downstream circuit breaker has stayed open for two minutes"
          description: "{{ $labels.operation }} is still open in the {{ $labels.environment }} tier."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#downstream-circuit-breakers

  - name: aihub-email-outbox
    rules:
      - alert: EmailProviderOutage
        expr: max(aihub_email_provider_outage_duration_seconds) > 300 and on() (sum(aihub_email_outbox_queued) > 0)
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "The shared Resend provider circuit has stayed open for more than five minutes"
          description: "Queued AIHUB email is waiting while the account-wide Resend circuit remains open. Check the provider status and email-outbox runbook."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/email-outbox.md#provider-wide-outage-backoff-adr-0122-410

      - alert: AIHUBEmailOutboxQueueAgeAboveBound
        expr: aihub_email_outbox_oldest_queued_age_seconds > 900
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "An AIHUB email has waited in the outbox for more than 15 minutes"
          description: "The oldest {{ $labels.kind }} email has been queued for {{ $value | humanizeDuration }}. Check dispatch and the shared Resend rate limiter."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/email-outbox.md#queue-backlog-when-dispatch-stops

      # Attempts run at 0, +1 and +5 minutes, so a 15-minute window covers a whole retry schedule.
      - alert: AIHUBEmailDeliveryTerminalFailure
        expr: sum by (job, kind) (increase(aihub_email_delivery_failed_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "An AIHUB email gave up without provider acceptance"
          description: "A {{ $labels.kind }} email on {{ $labels.job }} used all its attempts in the last 15 minutes and was never accepted by the provider. Check the error code and the recipient domain or from address for that kind."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/email-outbox.md#terminal-delivery-failure

      # A request the limiter cannot decide is handed back every 10 seconds, so a
      # real outage raises the counter continuously. Five minutes of increase held
      # for ten means a single blip, which stays inside the window, never pages.
      - alert: AIHUBEmailSendRateRedisUnavailable
        expr: sum by (job) (increase(aihub_redis_unavailable_total{seam="email_send_rate"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "The email send-rate limiter cannot use its Redis"
          description: "The send-rate limiter on {{ $labels.job }} has failed to get a send permit, a rate reservation or a recorded provider failure from Redis for 10 minutes, so email is handed back instead of sent. Check the counter, the Redis access list and the command timeout."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/email-outbox.md#send-rate-limiter-redis-unavailable

      # Invitations stop at 80% to reserve recovery capacity; alert at cutoff.
      - alert: AIHUBEmailDailySendBudgetNearLimit
        expr: aihub_email_daily_send_budget{measurement="used"} / ignoring(measurement) aihub_email_daily_send_budget{measurement="limit"} >= 0.8
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "AIHUB has used 80% of its daily email budget"
          description: "The shared UTC-day Resend budget has reached the invitation cutoff; protected recovery capacity remains."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/email-outbox.md#daily-email-budget

      # A refusal means the outbox cannot get mail out within its credential's
      # lifetime (#635). The counter is exposed at 0 for each gated kind, so the
      # first refusal after a restart is an increase.
      - alert: AIHUBEmailOutboxBackpressureRefusing
        expr: sum by (job, kind) (increase(aihub_email_outbox_backpressure_refusals_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "AIHUB is refusing email-sending requests because the outbox is backlogged"
          description: "{{ $labels.job }} refused {{ $labels.kind }} requests in the last 15 minutes because the oldest queued email has used 75% of its credential lifetime. Check dispatch, the provider circuit, and the shared rate limiter."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/email-outbox.md#backpressure-refusals-635

      - alert: AIHUBEmailCredentialExpiredBeforeDispatch
        expr: time() - aihub_email_delivery_cancelled_timestamp_seconds{reason="credential_expired"} < 900
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "An AIHUB email credential expired before dispatch"
          description: "A {{ $labels.kind }} credential expired while queued. Check the outbox backlog and shared rate limiter."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/email-outbox.md#credential-expiry-alerts-other-cancellations-do-not

  - name: aihub-certificates-and-clock
    rules:
      - alert: AIHUBHostClockUnsynchronizedOrOffsetAboveBound
        expr: abs(node_timex_offset_seconds{job=~"aihub-(production|monitoring)-node"}) > 5 or node_timex_sync_status{job=~"aihub-(production|monitoring)-node"} == 0
        for: 1m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "AIHUB host clock is unsynchronized or offset by more than five seconds"
          description: "{{ $labels.host }} reports an unsynchronized time service or an offset above five seconds. This proposed bound is below the 30-second TOTP step and 60-second JWT/assertion skew allowance."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#host-clock

      - alert: AIHUBMonitoringTargetDown
        expr: up{job=~"aihub-.*"} == 0
        for: 2m
        labels:
          severity: critical
          owner: aihub-operations
        annotations:
          summary: "An AIHUB observability target is unavailable"
          description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#target-health

      - alert: AIHUBCertificateProbeFailed
        expr: probe_success{job="aihub-certificate-expiry"} == 0
        for: 1m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "An AIHUB TLS certificate probe failed"
          description: "The scheduled TLS probe failed for {{ $labels.instance }}."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#certificates

      - alert: AIHUBCertificateExpiresWithin14Days
        expr: probe_ssl_earliest_cert_expiry{job="aihub-certificate-expiry"} - time() < 14 * 24 * 60 * 60
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "An AIHUB or asset TLS certificate expires within 14 days"
          description: "Certificate expiry probe target {{ $labels.instance }} is within 14 days."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#certificates

  # #291: black-box edge probe and dead-man's switch for host scheduled jobs.
  # The job metrics come from files the jobs write for node-exporter's textfile
  # collector on Production; Prometheus, not cron, notices a missed run.
  - name: aihub-edge-and-scheduled-jobs
    rules:
      - alert: AIHUBEdgeProbeFailed
        expr: probe_success{job="aihub-edge-health"} == 0
        for: 2m
        labels:
          severity: critical
          owner: aihub-operations
        annotations:
          summary: "An AIHUB public hostname is failing through the edge"
          description: "{{ $labels.instance }} has not answered 2xx through the public edge for two minutes."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#edge-probe

      - alert: AIHUBScheduledJobFailed
        expr: aihub_host_job_last_failure_timestamp_seconds > aihub_host_job_last_success_timestamp_seconds or (aihub_host_job_last_failure_timestamp_seconds unless aihub_host_job_last_success_timestamp_seconds)
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "An AIHUB scheduled job failed"
          description: "The last {{ $labels.task }} run failed; the alert clears on its next success."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#scheduled-jobs

      # ponytail: a task that has never succeeded has no series and never fires
      # here; list expected tasks with absent() if a job is ever added unseen.
      - alert: AIHUBScheduledJobMissed
        expr: time() - aihub_host_job_last_success_timestamp_seconds > aihub_host_job_max_age_seconds
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "An AIHUB scheduled job has not succeeded within its window"
          description: "{{ $labels.task }} last succeeded {{ $value | humanizeDuration }} ago."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#scheduled-jobs

  # Written every minute by scripts/ops/host-jobs/container-watchdog.sh (#396).
  # Each event alert stays active for 15 minutes after the event.
  - name: aihub-container-watchdog
    rules:
      - alert: AIHUBContainerOOMKilled
        expr: time() - aihub_container_last_event_timestamp_seconds{event="oom"} < 900
        for: 0m
        labels:
          severity: critical
          owner: aihub-operations
        annotations:
          summary: "An AIHUB container was killed for running out of memory"
          description: "{{ $labels.name }} (revision {{ $labels.revision }}) was OOM-killed, which dropped every request in flight on it. Docker restarts it."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#oom-kill

      - alert: AIHUBContainerDisrupted
        expr: time() - aihub_container_last_event_timestamp_seconds{event=~"exit|unhealthy|watchdog_restart"} < 900
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "An AIHUB container exited, became unhealthy, or was restarted"
          description: '{{ $labels.name }} (revision {{ $labels.revision }}) {{ if eq $labels.event "exit" }}exited with code {{ $labels.exit_code }} without a stop request{{ else if eq $labels.event "unhealthy" }}became unhealthy{{ else }}was restarted by the watchdog because it was unhealthy{{ end }}.'
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#disruption

      - alert: AIHUBContainerStillUnhealthy
        expr: aihub_container_unhealthy == 1
        for: 3m
        labels:
          severity: critical
          owner: aihub-operations
        annotations:
          summary: "An AIHUB container stays unhealthy and the watchdog is not restarting it"
          description: "{{ $labels.name }} (revision {{ $labels.revision }}) has been unhealthy for three minutes. The watchdog never restarts vault-agent, and stops restarting an app container after three restarts in an hour."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#still-unhealthy

  # Also written by container-watchdog.sh (#825). Vault Agent re-reads the
  # bundle's static KV secrets every 5 minutes; 10 minutes of margin gives the
  # warning at 15. Nothing in the bundle has a Vault-managed expiry, so the
  # critical alert marks the point where a rotation or a restart that needs a
  # fresh render has had an hour to fail unnoticed.
  - name: aihub-secret-delivery
    rules:
      - alert: AIHUBSecretDeliveryStalled
        expr: time() - aihub_secret_delivery_last_healthy_timestamp_seconds > 900
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "AIHUB runtime secrets have not been renderable for 15 minutes"
          description: 'Secret delivery has not been healthy for {{ $value | humanizeDuration }} (latest reason: {{ with query "aihub_secret_delivery_healthy == 0" }}{{ . | first | label "reason" }}{{ end }}). The application keeps running on the secrets it loaded at start.'
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#secret-delivery

      - alert: AIHUBSecretDeliveryStalledLong
        expr: time() - aihub_secret_delivery_last_healthy_timestamp_seconds > 3600
        for: 0m
        labels:
          severity: critical
          owner: aihub-operations
        annotations:
          summary: "AIHUB runtime secrets have not been renderable for an hour"
          description: 'Secret delivery has not been healthy for {{ $value | humanizeDuration }} (latest reason: {{ with query "aihub_secret_delivery_healthy == 0" }}{{ . | first | label "reason" }}{{ end }}). A secret rotation will not reach AIHUB until this is fixed.'
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#secret-delivery

      - alert: AIHUBRuntimeSecretsRestartRequired
        expr: aihub_runtime_secrets_restart_required == 1
        for: 5m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "An AIHUB app runs on secrets older than the rendered bundle"
          description: "{{ $labels.name }} (revision {{ $labels.revision }}) started before the rendered secret bundle last changed. It reads secrets only at start, so it needs a restart to use them."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#restart-required

  # SSH logins on the production host, written by container-watchdog.sh
  # (#570). Each login alert stays active for an hour after the login.
  - name: aihub-ssh-logins
    rules:
      - alert: AIHUBSSHPasswordLogin
        expr: time() - aihub_ssh_unexpected_login_timestamp_seconds{reason="password"} < 3600
        for: 0m
        labels:
          severity: critical
          owner: aihub-operations
        annotations:
          summary: "The production host accepted an SSH password login"
          description: "sshd accepted a password login for {{ $labels.user }}, although it is configured for keys only. Check the sshd configuration and who logged in."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#ssh-logins

      - alert: AIHUBSSHNewKeyLogin
        expr: time() - aihub_ssh_unexpected_login_timestamp_seconds{reason="new_key"} < 3600
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "A key that never logged in before was used on the production host"
          description: "{{ $labels.user }} logged in with key SHA256:{{ $labels.key }}..., which has not logged in before. Confirm whose key it is."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#ssh-logins

      - alert: AIHUBSSHAuthFailureBurst
        expr: increase(aihub_ssh_auth_failures_total[10m]) > 50
        for: 0m
        labels:
          severity: warning
          owner: aihub-operations
        annotations:
          summary: "A burst of failed SSH logins on the production host"
          description: "{{ $value | humanize }} failed SSH login attempts in 10 minutes. sshd penalizes each source on its own; check whether one key holder is locked out or a scan is running."
          runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#ssh-logins
