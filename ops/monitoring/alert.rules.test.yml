# promtool test rules: the #291 edge and scheduled-job alerts.
rule_files:
  - alert.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'probe_success{job="aihub-edge-health",instance="https://api.aihubproduction.com/health"}'
        values: "1 0 0 0 0"
      # report succeeded at t=0 with an 8400 s window; never again.
      - series: 'aihub_host_job_last_success_timestamp_seconds{job="aihub-production-node",task="report"}'
        values: "0x200"
      - series: 'aihub_host_job_max_age_seconds{job="aihub-production-node",task="report"}'
        values: "8400x200"
      # quota succeeded at t=0, then failed at t=300 s.
      - series: 'aihub_host_job_last_success_timestamp_seconds{job="aihub-production-node",task="quota"}'
        values: "0x200"
      - series: 'aihub_host_job_max_age_seconds{job="aihub-production-node",task="quota"}'
        values: "90000x200"
      - series: 'aihub_host_job_last_failure_timestamp_seconds{job="aihub-production-node",task="quota"}'
        values: "_ _ _ _ _ 300x195"
      # prune has only ever failed.
      - series: 'aihub_host_job_last_failure_timestamp_seconds{job="aihub-production-node",task="prune"}'
        values: "60x200"
    alert_rule_test:
      - eval_time: 2m
        alertname: AIHUBEdgeProbeFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AIHUBEdgeProbeFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: aihub-operations
              job: aihub-edge-health
              instance: https://api.aihubproduction.com/health
            exp_annotations:
              summary: "An AIHUB public hostname is failing through the edge"
              description: "https://api.aihubproduction.com/health has not answered 2xx through the public edge for two minutes."
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#edge-probe
      - eval_time: 4m
        alertname: AIHUBScheduledJobFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: aihub-operations
              job: aihub-production-node
              task: prune
            exp_annotations:
              summary: "An AIHUB scheduled job failed"
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#scheduled-jobs
              description: "The last prune run failed; the alert clears on its next success."
      - eval_time: 6m
        alertname: AIHUBScheduledJobFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: aihub-operations
              job: aihub-production-node
              task: prune
            exp_annotations:
              summary: "An AIHUB scheduled job failed"
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#scheduled-jobs
              description: "The last prune run failed; the alert clears on its next success."
          - exp_labels:
              severity: warning
              owner: aihub-operations
              job: aihub-production-node
              task: quota
            exp_annotations:
              summary: "An AIHUB scheduled job failed"
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#scheduled-jobs
              description: "The last quota run failed; the alert clears on its next success."
      - eval_time: 140m
        alertname: AIHUBScheduledJobMissed
        exp_alerts: []
      - eval_time: 141m
        alertname: AIHUBScheduledJobMissed
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: aihub-operations
              job: aihub-production-node
              task: report
            exp_annotations:
              summary: "An AIHUB scheduled job has not succeeded within its window"
              description: "report last succeeded 2h 21m 0s ago."
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/aihub-observability.md#scheduled-jobs

  # #396 container watchdog: an OOM kill at t=120 s, an exit at t=0, and an
  # unhealthy vault-agent from t=0. An empty exit_code label is dropped.
  - interval: 1m
    input_series:
      - series: 'aihub_container_last_event_timestamp_seconds{job="aihub-production-node",name="aihub-production-app-1",revision="abc",event="oom",exit_code=""}'
        values: "_ _ 120x28"
      - series: 'aihub_container_last_event_timestamp_seconds{job="aihub-production-node",name="aihub-production-app-1",revision="abc",event="exit",exit_code="137"}'
        values: "0x30"
      - series: 'aihub_container_unhealthy{job="aihub-production-node",name="aihub-production-vault-agent-1",revision="abc"}'
        values: "1x30"
      - series: 'aihub_container_unhealthy{job="aihub-production-node",name="aihub-production-app-1",revision="abc"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 0m
        alertname: AIHUBContainerOOMKilled
        exp_alerts: []
      - eval_time: 2m
        alertname: AIHUBContainerOOMKilled
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: aihub-operations
              job: aihub-production-node
              name: aihub-production-app-1
              revision: abc
              event: oom
            exp_annotations:
              summary: "An AIHUB container was killed for running out of memory"
              description: "aihub-production-app-1 (revision abc) was OOM-killed, which dropped every request in flight on it. Docker restarts it."
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#oom-kill
      - eval_time: 17m
        alertname: AIHUBContainerOOMKilled
        exp_alerts: []
      - eval_time: 5m
        alertname: AIHUBContainerDisrupted
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: aihub-operations
              job: aihub-production-node
              name: aihub-production-app-1
              revision: abc
              event: exit
              exit_code: "137"
            exp_annotations:
              summary: "An AIHUB container exited, became unhealthy, or was restarted"
              description: "aihub-production-app-1 (revision abc) exited with code 137 without a stop request."
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#disruption
      - eval_time: 2m
        alertname: AIHUBContainerStillUnhealthy
        exp_alerts: []
      - eval_time: 3m
        alertname: AIHUBContainerStillUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: aihub-operations
              job: aihub-production-node
              name: aihub-production-vault-agent-1
              revision: abc
            exp_annotations:
              summary: "An AIHUB container stays unhealthy and the watchdog is not restarting it"
              description: "aihub-production-vault-agent-1 (revision abc) has been unhealthy for three minutes. The watchdog never restarts vault-agent, and stops restarting an app container after three restarts in an hour."
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#still-unhealthy

  # #825 secret delivery: last healthy at t=0, sealed from t=1m; one app
  # started before the bundle changed.
  - interval: 1m
    input_series:
      - series: 'aihub_secret_delivery_last_healthy_timestamp_seconds{job="aihub-production-node"}'
        values: "0x70"
      - series: 'aihub_secret_delivery_healthy{job="aihub-production-node",reason="vault_sealed"}'
        values: "_ 0x69"
      - series: 'aihub_runtime_secrets_restart_required{job="aihub-production-node",name="aihub-production-app-1",revision="abc"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 15m
        alertname: AIHUBSecretDeliveryStalled
        exp_alerts: []
      - eval_time: 16m
        alertname: AIHUBSecretDeliveryStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: aihub-operations
              job: aihub-production-node
            exp_annotations:
              summary: "AIHUB runtime secrets have not been renderable for 15 minutes"
              description: "Secret delivery has not been healthy for 16m 0s (latest reason: vault_sealed). The application keeps running on the secrets it loaded at start."
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#secret-delivery
      - eval_time: 60m
        alertname: AIHUBSecretDeliveryStalledLong
        exp_alerts: []
      - eval_time: 61m
        alertname: AIHUBSecretDeliveryStalledLong
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: aihub-operations
              job: aihub-production-node
            exp_annotations:
              summary: "AIHUB runtime secrets have not been renderable for an hour"
              description: "Secret delivery has not been healthy for 1h 1m 0s (latest reason: vault_sealed). A secret rotation will not reach AIHUB until this is fixed."
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#secret-delivery
      - eval_time: 4m
        alertname: AIHUBRuntimeSecretsRestartRequired
        exp_alerts: []
      - eval_time: 5m
        alertname: AIHUBRuntimeSecretsRestartRequired
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: aihub-operations
              job: aihub-production-node
              name: aihub-production-app-1
              revision: abc
            exp_annotations:
              summary: "An AIHUB app runs on secrets older than the rendered bundle"
              description: "aihub-production-app-1 (revision abc) started before the rendered secret bundle last changed. It reads secrets only at start, so it needs a restart to use them."
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#restart-required

  # #570 SSH logins: a new key at t=60 s, a password login at t=120 s, and
  # 60 failures between 1m and 2m.
  - interval: 1m
    input_series:
      - series: 'aihub_ssh_unexpected_login_timestamp_seconds{job="aihub-production-node",user="kiet",key="abc",reason="new_key"}'
        values: "_ 60x70"
      - series: 'aihub_ssh_unexpected_login_timestamp_seconds{job="aihub-production-node",user="root",key="-",reason="password"}'
        values: "_ _ 120x70"
      - series: 'aihub_ssh_auth_failures_total{job="aihub-production-node"}'
        values: "0 0 60 60 60 60 60 60 60 60 60 60 60 60 60"
    alert_rule_test:
      - eval_time: 1m
        alertname: AIHUBSSHNewKeyLogin
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: aihub-operations
              job: aihub-production-node
              user: kiet
              key: abc
              reason: new_key
            exp_annotations:
              summary: "A key that never logged in before was used on the production host"
              description: "kiet logged in with key SHA256:abc..., which has not logged in before. Confirm whose key it is."
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#ssh-logins
      - eval_time: 61m
        alertname: AIHUBSSHNewKeyLogin
        exp_alerts: []
      - eval_time: 2m
        alertname: AIHUBSSHPasswordLogin
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: aihub-operations
              job: aihub-production-node
              user: root
              key: "-"
              reason: password
            exp_annotations:
              summary: "The production host accepted an SSH password login"
              description: "sshd accepted a password login for root, although it is configured for keys only. Check the sshd configuration and who logged in."
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#ssh-logins
      - eval_time: 3m
        alertname: AIHUBSSHAuthFailureBurst
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: aihub-operations
              job: aihub-production-node
            exp_annotations:
              summary: "A burst of failed SSH logins on the production host"
              description: "60 failed SSH login attempts in 10 minutes. sshd penalizes each source on its own; check whether one key holder is locked out or a scan is running."
              runbook_url: https://github.com/AiHub-Ecosystem/aihub-be/blob/main/docs/operations/container-watchdog.md#ssh-logins
      - eval_time: 14m
        alertname: AIHUBSSHAuthFailureBurst
        exp_alerts: []
