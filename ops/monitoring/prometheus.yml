global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # Production listeners are local SSH forwards on the monitoring bridge gateway.
  - job_name: aihub-production-node
    static_configs:
      - targets: [172.27.0.1:19100]
        labels: { host: production }

  - job_name: aihub-production-containers
    static_configs:
      - targets: [172.27.0.1:19101]
        labels: { host: production }
    metric_relabel_configs:
      - source_labels: [name]
        regex: "aihub.*"
        action: keep

  - job_name: aihub-postgres
    static_configs:
      - targets: [172.27.0.1:19102]
        labels: { host: production, database_cluster: shared }

  - job_name: aihub-production-app
    metrics_path: /metrics
    static_configs:
      - targets: [172.27.0.1:19103]
        labels: { host: production, environment: production }

  - job_name: aihub-sandbox-app
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/sandbox-targets/targets.yml]

  - job_name: aihub-monitoring-node
    static_configs:
      - targets: [172.27.0.1:9100]
        labels: { host: monitoring }

  - job_name: aihub-redis
    static_configs:
      - targets: [aihub-redis-exporter:9121]
        labels: { host: monitoring, redis: aihub }

  - job_name: aihub-blackbox
    static_configs:
      - targets: [aihub-blackbox-exporter:9115]
        labels: { host: monitoring }

  - job_name: aihub-certificate-expiry
    scrape_interval: 1h
    metrics_path: /probe
    params:
      module: [tcp_tls]
    static_configs:
      - targets:
          - api.aihubproduction.com:443
          - sandbox.aihubproduction.com:443
          - aihubproduction.com:443
          - www.aihubproduction.com:443
          - s3.wispace.app:443
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: aihub-blackbox-exporter:9115

  # #291: liveness through the real public edge, from outside the Production
  # host. The Customer Web root stands in until it has a health route
  # (AiHub-Frontend#94).
  - job_name: aihub-edge-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.aihubproduction.com/health
          - https://sandbox.aihubproduction.com/health
          - https://aihubproduction.com/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: aihub-blackbox-exporter:9115
