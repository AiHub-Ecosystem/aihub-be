module(load="imtcp" MaxSessions="16")

template(name="AIHUBAppJSON" type="list") {
    property(name="msg" droplastlf="on")
    constant(value="\n")
}

ruleset(name="aihub-app-logs") {
    if $programname == "aihub-production" then {
        action(type="omfile"
            file="/var/log/aihub-app-production.log"
            template="AIHUBAppJSON"
            fileCreateMode="0640"
            fileOwner="syslog"
            fileGroup="adm"
            rotation.sizeLimit="10485760"
            rotation.sizeLimitCommand="/bin/sh -c '/usr/bin/mv -f /var/log/aihub-app-production.log /var/log/aihub-app-production.log.1'"
        )
        stop
    }
    if $programname == "aihub-sandbox" then {
        action(type="omfile"
            file="/var/log/aihub-app-sandbox.log"
            template="AIHUBAppJSON"
            fileCreateMode="0640"
            fileOwner="syslog"
            fileGroup="adm"
            rotation.sizeLimit="10485760"
            rotation.sizeLimitCommand="/bin/sh -c '/usr/bin/mv -f /var/log/aihub-app-sandbox.log /var/log/aihub-app-sandbox.log.1'"
        )
        stop
    }
    stop
}

input(type="imtcp" address="127.0.0.1" port="1514" ruleset="aihub-app-logs")
