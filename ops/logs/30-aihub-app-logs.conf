module(load="imtcp" MaxSessions="16")

template(name="AIHUBAppJSON" type="list") {
    property(name="msg" droplastlf="on")
    constant(value="\n")
}

ruleset(name="aihub-app-logs") {
    if $programname == "aihub-production" then {
        action(type="omfile" file="/var/log/aihub-app-production.log" template="AIHUBAppJSON" fileCreateMode="0640" fileOwner="syslog" fileGroup="adm")
        stop
    }
    if $programname == "aihub-sandbox" then {
        action(type="omfile" file="/var/log/aihub-app-sandbox.log" template="AIHUBAppJSON" fileCreateMode="0640" fileOwner="syslog" fileGroup="adm")
        stop
    }
    stop
}

input(type="imtcp" address="127.0.0.1" port="1514" ruleset="aihub-app-logs")
