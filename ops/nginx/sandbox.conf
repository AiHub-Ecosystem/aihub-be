server {
      server_name sandbox.aihubproduction.com;
      access_log /var/log/aihub-access.log aihub_access;
      server_tokens off;
      add_header Strict-Transport-Security "max-age=15552000" always;
      client_max_body_size 27m;

      location = /metrics {
          return 404;
      }

      location = /ready {
          return 404;
      }

      # Writing /v2 grading has a 125-second AIHUB budget (ADR-0143); see
      # aihub-api.conf. These blocks repeat the proxy headers because nginx drops
      # inherited ones in a location that sets its own.
      location = /v2/ielts/writing/task1/grade {
          proxy_pass http://127.0.0.1:3022;
          proxy_read_timeout 135s;
          proxy_send_timeout 135s;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location = /v2/ielts/writing/task2/grade {
          proxy_pass http://127.0.0.1:3022;
          proxy_read_timeout 135s;
          proxy_send_timeout 135s;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location = /v2/ielts/writing/micro-exercises {
          proxy_pass http://127.0.0.1:3022;
          proxy_read_timeout 55s;
          proxy_send_timeout 55s;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location = /v2/ielts/writing/long-writing-exercises {
          proxy_pass http://127.0.0.1:3022;
          proxy_read_timeout 45s;
          proxy_send_timeout 45s;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location = /v2/ielts/writing/micro-exercises/grade {
          proxy_pass http://127.0.0.1:3022;
          proxy_read_timeout 30s;
          proxy_send_timeout 30s;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
          proxy_pass http://127.0.0.1:3022;
          proxy_read_timeout 75s;
          proxy_send_timeout 75s;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      listen 443 ssl;
      ssl_certificate /etc/letsencrypt/live/sandbox.aihubproduction.com/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/sandbox.aihubproduction.com/privkey.pem;
      include /etc/letsencrypt/options-ssl-nginx.conf;
      ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  }

  server {
      listen 80;
      server_name sandbox.aihubproduction.com;
      access_log /var/log/aihub-access.log aihub_access;
      server_tokens off;
      return 301 https://$host$request_uri;
  }

  # Scrape-only listener for the private monitoring SSH tunnel. Keep this on
  # loopback so the public sandbox host never exposes application metrics.
  server {
      listen 127.0.0.1:19104;
      server_name _;
      access_log off;
      server_tokens off;

      location = /metrics {
          proxy_pass http://127.0.0.1:3022;
      }

      location / {
          return 404;
      }
  }
