# API only. The apex site, Certbot redirects, and legacy alias remain in the
# operator-managed mixed host file and are not deployed by AIHUB.
server {
    server_name api.aihubproduction.com;
    access_log /var/log/aihub-access.log aihub_access;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 27m;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /metrics {
        return 404;
    }

    location = /ready {
        return 404;
    }

    location = /v1/ielts/speaking/grading {
        gzip on;
        gzip_types application/json;
        gzip_vary on;
        gzip_proxied any;

        proxy_pass http://127.0.0.1:3021;
        proxy_request_buffering off;
    }

    location = /v1/ielts/speaking/grading-json {
        gzip on;
        gzip_types application/json;
        gzip_vary on;
        gzip_proxied any;

        proxy_pass http://127.0.0.1:3021;
    }

    # Writing /v2 grading has a 125-second AIHUB budget (ADR-0143), longer than
    # the 75 seconds the rest of the API gets. 135 seconds is that budget plus the
    # same 10-second margin the 60-second routes keep, so AIHUB answers its own
    # AI_SERVICE_TIMEOUT before nginx can cut the call with a bare 504.
    location = /v2/ielts/writing/task1/grade {
        gzip off;

        proxy_pass http://127.0.0.1:3021;
        proxy_read_timeout 135s;
        proxy_send_timeout 135s;
    }

    location = /v2/ielts/writing/task2/grade {
        gzip off;

        proxy_pass http://127.0.0.1:3021;
        proxy_read_timeout 135s;
        proxy_send_timeout 135s;
    }

    location / {
        gzip off;

        proxy_pass http://127.0.0.1:3021;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.aihubproduction.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aihubproduction.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name api.aihubproduction.com;
    access_log /var/log/aihub-access.log aihub_access;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# Scrape-only listener for the private monitoring SSH tunnel. Keep this on
# loopback so the public API host never exposes application metrics.
server {
    listen 127.0.0.1:19103;
    server_name _;
    access_log off;
    server_tokens off;

    location = /metrics {
        proxy_pass http://127.0.0.1:3021;
    }

    location / {
        return 404;
    }
}
