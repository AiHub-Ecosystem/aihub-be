# API only. The apex site, Certbot redirects, and legacy alias remain in the
# operator-managed mixed host file and are not deployed by AIHUB.
server {
    server_name api.aihubproduction.com;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 27m;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /metrics {
        return 404;
    }

    location = /ready {
        return 404;
    }

    location = /v1/ielts/speaking/grading {
        gzip on;
        gzip_types application/json;
        gzip_vary on;
        gzip_proxied any;

        proxy_pass http://127.0.0.1:3021;
        proxy_request_buffering off;
    }

    location = /v1/ielts/speaking/grading-json {
        gzip on;
        gzip_types application/json;
        gzip_vary on;
        gzip_proxied any;

        proxy_pass http://127.0.0.1:3021;
    }

    location / {
        gzip off;

        proxy_pass http://127.0.0.1:3021;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.aihubproduction.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aihubproduction.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name api.aihubproduction.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}
