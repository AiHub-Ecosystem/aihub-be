log_format aihub_access escape=json '{"timestamp":$msec,"client_ip":"$remote_addr","request_id":"$upstream_http_x_request_id","method":"$aihub_original_method","path":"$aihub_log_path","status":$status}';

# The nginx HTTP parser rejects a malformed request line before a location is
# selected. The error-page redirect answers it through an internal location, so
# the method becomes GET and $uri names that location. Recover the caller's
# method and path from the request line so the access record still describes
# what arrived. Keep these maps here: this file is the one AIHUB include that
# already lives in the nginx http context.
map $request $aihub_original_method {
    default GET;
    ~^(?<aihub_method>[^[:space:]]+)[[:space:]] $aihub_method;
}

map $request $aihub_request_path {
    default "";
    ~^[^[:space:]]+[[:space:]](?<aihub_path>[^?[:space:]]+)(\?[^[:space:]]*)?[[:space:]] $aihub_path;
}

map $uri $aihub_log_path {
    default $uri;
    /__aihub/bad-request $aihub_request_path;
}
