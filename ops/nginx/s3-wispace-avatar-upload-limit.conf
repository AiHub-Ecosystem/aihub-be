# AIHUB Avatar upload body bound for the shared S3 ingress (ADR-0199, #2008).
#
# This file is an operator-installed fragment for the HTTPS
# `server_name s3.wispace.app` block in /etc/nginx/sites-enabled/s3.wispace.app.
# It is not deployed by CD and is not part of the AIHUB API/Sandbox hosts.
# docs/operations/deploy-vps.md gives the install, verification, and rollback
# steps.
#
# Only the two default Avatar staging buckets take a 2 MiB ceiling. Every other
# path keeps the server's existing 500M policy, and the ACME, filer, and health
# locations keep their own blocks because this regex matches none of them.
#
# proxy_request_buffering is set explicitly below rather than left to the
# server or http default, so a parent that turns it off cannot stream an
# incomplete or oversized body to SeaweedFS. nginx reads the whole request
# body before it contacts the upstream, so an oversized upload is rejected
# while it is still being received and never reaches SeaweedFS: no staging
# object is created. The body is bounded at the ceiling; nginx spools past its
# small client_body_buffer_size to a temp file and unlinks it on rejection.
#
# The fragment covers the two default staging buckets. An operator enables one
# tier at a time by keeping only that tier's bucket in the alternation below;
# docs/operations/deploy-vps.md gives the Sandbox-first rollout and the
# per-tier rollback.

location ~ ^/(?:aihub-user-asset-staging|aihub-sandbox-user-asset-staging)/ {
    client_max_body_size 2097152;
    # Both are explicit so an inherited server or http setting cannot change
    # what this location does: buffering keeps a partial or oversized body away
    # from SeaweedFS, and not intercepting errors keeps SeaweedFS's own 413.
    proxy_request_buffering on;
    proxy_intercept_errors off;
    error_page 413 = @aihub_avatar_upload_too_large;

    # Copied from the observed `location /` so the signed Host, path, query,
    # and forwarding headers reach SeaweedFS unchanged. Keep these in step with
    # that block if the operator ever changes it.
    proxy_pass http://127.0.0.1:8333;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;
}

# nginx generates this 413 itself, so it carries no upstream CORS headers.
# Echo the origin only for the three deployed Customer Web origins so the
# browser can read the status instead of reporting an opaque network error.
# Only nginx-generated 413s reach this location; a 413 from SeaweedFS itself
# keeps its own headers and body.
location @aihub_avatar_upload_too_large {
    internal;

    if ($http_origin ~ "^https://(?:aihubproduction\.com|www\.aihubproduction\.com|sandbox\.aihubproduction\.com)$") {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
    }

    return 413;
}
