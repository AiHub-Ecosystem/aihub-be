name: Production image vulnerability scan

# #331: Scheduled scan of the container image currently deployed to Production.
# Runs daily to catch CVEs disclosed after an image has been published and deployed.
# When a fixable Critical or High CVE appears, it opens or updates a tracking issue.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  packages: read

concurrency:
  group: production-image-scan
  cancel-in-progress: true

jobs:
  scan:
    name: Scan deployed production image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Grype 0.87.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/grype.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/anchore/grype/releases/download/v0.87.0/grype_0.87.0_linux_amd64.tar.gz
          printf '%s  %s\n' \
            'be710d15f5477e5c77ce03d14e480263415d7ab135e04b8483663f688823087d' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" grype
          "$RUNNER_TEMP/grype" version
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Resolve deployed production image digest
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cd.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$run_id" ]]; then
            echo 'No successful production deployment run found.' >&2
            exit 1
          fi
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)"
          mkdir -p temp/production-image
          gh run download "$run_id" --name image-digest --dir temp/production-image
          digest="$(tr -d '\r\n' < temp/production-image/image-digest.txt)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}@$digest"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf 'Scanning deployed image `%s` (commit `%s`).\n' "$image" "$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Scan deployed image with Grype
        id: grype_scan
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          fixable_cves="$RUNNER_TEMP/fixable-cves.txt"
          grype "$IMAGE" --only-fixed --output json \
            | jq -r '(.matches // [])[] | select(.vulnerability.fix.state == "fixed" and (.vulnerability.severity == "High" or .vulnerability.severity == "Critical")) | "\(.vulnerability.severity) \(.vulnerability.id): \(.artifact.name) \(.artifact.version) -> fixed in \(.vulnerability.fix.versions // [] | join(", "))"' \
            | sed -n '1,40p' > "$fixable_cves"
          echo "report_file=$fixable_cves" >> "$GITHUB_OUTPUT"
          if [[ -s "$fixable_cves" ]]; then
            echo 'has_fixable_vulnerabilities=true' >> "$GITHUB_OUTPUT"
            {
              printf '### Fixable High/Critical CVEs\n\n'
              cat "$fixable_cves"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'has_fixable_vulnerabilities=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update issue on fixable Critical or High CVEs
        if: steps.grype_scan.outputs.has_fixable_vulnerabilities == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.image }}
          SHA: ${{ steps.image.outputs.sha }}
          REPORT_FILE: ${{ steps.grype_scan.outputs.report_file }}
        run: |
          set -euo pipefail
          title="Security: fixable CVE detected in deployed production image"
          cat <<EOF > issue-text.txt
          A scheduled vulnerability scan detected fixable Critical or High CVEs in the deployed production image \`$IMAGE\` (commit \`$SHA\`).

          Please inspect the scan report and bump the base image digest in \`Dockerfile\` per \`docs/operations/image-vulnerability-scanning.md\`.

          \`\`\`
          $(cat "$REPORT_FILE")
          \`\`\`
          EOF

          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file issue-text.txt
          else
            gh issue create \
              --title "$title" \
              --body-file issue-text.txt \
              --label ready-for-agent \
              --label P1 \
              --milestone "Image and supply-chain integrity"
            node scripts/checks/hooks/check-issue-triage.mjs
          fi
          exit 1
