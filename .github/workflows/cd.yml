name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
      actions: read
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Download the digest CI published
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-digest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Check the registry still holds the image CI booted
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image_name="ghcr.io/${REPOSITORY,,}"
          image="${image_name}:${IMAGE_TAG}"
          expected="$(tr -d '[:space:]' < image-digest.txt)"
          actual="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image")"
          test -n "$actual"
          printf 'CI published: %s\nregistry holds:  %s\nimage:          %s\n' \
            "$expected" "$actual" "$image"
          if [ "$expected" != "$actual" ]; then
            printf 'image digest mismatch: refusing to deploy %s\n' "$image" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    name: Blue-green deploy to VPS
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      AIHUB_IMAGE: ${{ needs.resolve.outputs.image }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
    steps:
      - name: Check out the image source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # `workflow_run` checks out the completed run's commit above. Keep the
      # guard itself from the current default-branch workflow so old reruns
      # cannot lack the guard implementation.
      - name: Check out the deployment guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .cd-guard
          fetch-depth: 0

      - name: Reject a stale CI revision before contacting the host
        id: stale_guard
        working-directory: .cd-guard
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          if [ "$source_sha" != "$DEPLOY_SHA" ]; then
            printf 'refusing to deploy: checked-out image source %s does not match CI run %s\n' \
              "$source_sha" "$DEPLOY_SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          outcome="$(node scripts/ci/deploy-target-guard.cjs "$DEPLOY_SHA" "$main_sha" --classify)"
          case "$outcome" in
            deploy)
              printf 'outcome=deploy\n' >> "$GITHUB_OUTPUT"
              printf 'Deploy target %s is current main.\n' "$DEPLOY_SHA"
              ;;
            superseded)
              printf 'outcome=superseded\n' >> "$GITHUB_OUTPUT"
              printf 'CI run target `%s` was superseded by current main `%s`.\n' \
                "$DEPLOY_SHA" "$main_sha" >> "$GITHUB_STEP_SUMMARY"
              printf 'Target %s was superseded by %s; skipping host contact.\n' \
                "$DEPLOY_SHA" "$main_sha"
              exit 0
              ;;
            *)
              printf 'refusing to deploy: unrecognized target outcome\n' >&2
              exit 1
              ;;
          esac

      - name: Configure SSH
        if: ${{ steps.stale_guard.outputs.outcome == 'deploy' }}
        id: ssh
        shell: bash
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9._:-]+$ ]] || exit 1
          [[ "$VPS_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          (( 10#$VPS_PORT >= 1 && 10#$VPS_PORT <= 65535 )) || exit 1
          ssh_dir="$RUNNER_TEMP/aihub-ssh"
          ssh_config="$ssh_dir/config"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$VPS_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key"
          chmod 600 "$ssh_dir/known_hosts"
          {
            printf 'Host aihub-deploy\n'
            printf '  HostName %s\n' "$VPS_HOST"
            printf '  User %s\n' "$VPS_USER"
            printf '  Port %s\n' "$VPS_PORT"
            printf '  IdentityFile %s/key\n' "$ssh_dir"
            printf '  UserKnownHostsFile %s/known_hosts\n' "$ssh_dir"
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  LogLevel QUIET\n'
            printf '  ControlMaster auto\n'
            printf '  ControlPath %s/%%C\n' "$ssh_dir"
            printf '  ControlPersist 60m\n'
            printf '  ConnectTimeout 10\n'
            printf '  ServerAliveInterval 15\n'
            printf '  ServerAliveCountMax 3\n'
          } > "$ssh_config"
          chmod 600 "$ssh_config"
          printf 'AIHUB_SSH_CONFIG=%s\n' "$ssh_config" >> "$GITHUB_ENV"
          error_file="$ssh_dir/open.stderr"
          for attempt in 1 2 3; do
            if ssh -F "$ssh_config" -MNf aihub-deploy 2>"$error_file"; then
              rm -f "$error_file"
              printf 'Opened the authenticated shared SSH connection.\n'
              exit 0
            else
              status=$?
            fi
            if [[ "$status" -ne 255 ]] || ! grep -Eiq '(kex|ssh)_exchange_identification:.*(connection reset|connection closed)' "$error_file"; then
              rm -f "$error_file"
              printf 'SSH connection setup failed before deployment commands; not retrying.\n' >&2
              exit "$status"
            fi
            if [[ "$attempt" -eq 3 ]]; then
              rm -f "$error_file"
              printf 'SSH pre-authentication connection failed after 3 attempts.\n' >&2
              exit 255
            fi
            delay="$attempt"
            printf 'SSH pre-authentication reset; retrying connection setup (%s/3).\n' "$attempt"
            sleep "$delay"
          done

      - name: Check host revisions and recheck main before writes
        if: ${{ steps.stale_guard.outputs.outcome == 'deploy' }}
        id: target_guard
        working-directory: .cd-guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_APP_DIR"
          target=aihub-deploy
          ssh_opts=(-F "$AIHUB_SSH_CONFIG")
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          state="$(ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          helper=./scripts/ops/blue-green/blue-green-host.sh
          if [[ ! -x "$helper" ]]; then
            helper=./scripts/ops/blue-green-host.sh
          fi
          "$helper" status
          REMOTE
          )"
          printf 'Host revisions before deployment:\n%s\n' "$state"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          printf '%s\n' "$state" | node scripts/ci/deploy-target-guard.cjs "$DEPLOY_SHA" "$main_sha"

      - name: Stage host job installer
        if: ${{ steps.stale_guard.outputs.outcome == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_APP_DIR"
          target=aihub-deploy
          ssh_opts=(-F "$AIHUB_SSH_CONFIG")
          scp_opts=(-F "$AIHUB_SSH_CONFIG")
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$APP_DIR/.aihub-host-jobs-candidate"
          REMOTE
          scp "${scp_opts[@]}" \
            scripts/ops/host-jobs/install-host-jobs.sh \
            "$target:$VPS_APP_DIR/.aihub-host-jobs-candidate/install-host-jobs.sh"
          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          chmod 755 "$APP_DIR/.aihub-host-jobs-candidate/install-host-jobs.sh"
          test -s "$APP_DIR/.aihub-host-jobs-candidate/install-host-jobs.sh"
          REMOTE

      - name: Log in to GHCR on VPS
        if: ${{ steps.stale_guard.outputs.outcome == 'deploy' }}
        id: ghcr_login
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -eu
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_PULL_TOKEN"
          target=aihub-deploy
          ssh_opts=(-F "$AIHUB_SSH_CONFIG")
          printf '%s' "$GHCR_PULL_TOKEN" | ssh "${ssh_opts[@]}" "$target" \
            "sudo -n docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Pause and drain AIHUB host jobs
        if: ${{ steps.stale_guard.outputs.outcome == 'deploy' }}
        id: pause_host_jobs
        shell: bash
        run: |
          set -euo pipefail
          target=aihub-deploy
          ssh_opts=(-F "$AIHUB_SSH_CONFIG")
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          "$APP_DIR/.aihub-host-jobs-candidate/install-host-jobs.sh" suspend
          REMOTE

      - name: Sync deployment files to VPS
        if: ${{ steps.stale_guard.outputs.outcome == 'deploy' }}
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          target=aihub-deploy
          ssh_opts=(-F "$AIHUB_SSH_CONFIG")
          scp_opts=(-F "$AIHUB_SSH_CONFIG")
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -eu
          test -d "$APP_DIR/.aihub-host-jobs-state"
          sync_candidate="$APP_DIR/.aihub-host-jobs-sync-candidate"
          sync_backup="$APP_DIR/.aihub-host-jobs-state/sync-backup"
          helper_path=scripts/ops/blue-green/blue-green-host.sh
          if [[ ! -x "$APP_DIR/$helper_path" ]]; then
            helper_path=scripts/ops/blue-green-host.sh
          fi
          test -f "$APP_DIR/$helper_path"
          mkdir -p "$sync_candidate" "$sync_backup"
          rm -f -- "$sync_candidate/blue-green-host.sh" \
            "$sync_candidate/docker-compose.production.yml" \
            "$sync_backup/blue-green-host.sh" \
            "$sync_backup/blue-green-host.path" \
            "$sync_backup/docker-compose.production.yml" \
            "$sync_backup/ready"
          cp -p -- "$APP_DIR/$helper_path" "$sync_backup/blue-green-host.sh"
          printf '%s\n' "$helper_path" >"$sync_backup/blue-green-host.path"
          cp -p -- "$APP_DIR/docker-compose.production.yml" "$sync_backup/docker-compose.production.yml"
          : >"$sync_backup/ready"
          chmod 600 "$sync_backup/ready"
          mkdir -p "$APP_DIR/scripts/ops" "$APP_DIR/scripts/ops/blue-green" "$APP_DIR/scripts/ops/logs" "$APP_DIR/scripts/ops/backups" "$APP_DIR/scripts/ops/host-jobs" "$APP_DIR/ops/nginx" \
            "$APP_DIR/ops/vault/agent" "$APP_DIR/ops/vault/templates" \
            "$APP_DIR/ops/host-jobs" "$APP_DIR/.aihub-host-jobs-candidate"
          REMOTE
          scp "${scp_opts[@]}" \
            docker-compose.production.yml \
            "$target:$VPS_APP_DIR/.aihub-host-jobs-sync-candidate/"
          scp "${scp_opts[@]}" \
            scripts/ops/host-jobs/install-host-jobs.sh \
            "$target:$VPS_APP_DIR/.aihub-host-jobs-sync-candidate/"
          scp "${scp_opts[@]}" \
            scripts/ops/blue-green/blue-green-host.sh \
            "$target:$VPS_APP_DIR/.aihub-host-jobs-sync-candidate/"
          scp "${scp_opts[@]}" \
            scripts/ops/logs/request-log-lookup.sh \
            "$target:$VPS_APP_DIR/scripts/ops/logs/"
          scp "${scp_opts[@]}" \
            scripts/ops/backups/backup-postgres.sh \
            scripts/ops/backups/restore-postgres-rehearsal.sh \
            "$target:$VPS_APP_DIR/scripts/ops/backups/"
          scp "${scp_opts[@]}" \
            scripts/ops/host-jobs/container-watchdog.sh \
            "$target:$VPS_APP_DIR/scripts/ops/host-jobs/"
          scp "${scp_opts[@]}" \
            scripts/ops/host-jobs/host-scheduled-job.sh \
            ops/host-jobs/aihub.crontab \
            "$target:$VPS_APP_DIR/.aihub-host-jobs-candidate/"
          scp "${scp_opts[@]}" \
            ops/nginx/aihub-api.conf \
            ops/nginx/sandbox.conf \
            ops/nginx/00-aihub-log-format.conf \
            ops/nginx/aihub-access-logrotate \
            "$target:$VPS_APP_DIR/ops/nginx/"
          scp "${scp_opts[@]}" \
            ops/vault/agent/aihub-runtime.hcl \
            "$target:$VPS_APP_DIR/ops/vault/agent/"
          scp "${scp_opts[@]}" \
            ops/vault/templates/runtime-secrets.json.ctmpl \
            ops/vault/templates/auth-mfa-secrets.json.ctmpl \
            ops/vault/templates/connection-secrets.json.ctmpl \
            "$target:$VPS_APP_DIR/ops/vault/templates/"
          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -eu
          chmod 755 "$APP_DIR/scripts/ops/logs/request-log-lookup.sh"
          chmod 755 "$APP_DIR/scripts/ops/host-jobs/container-watchdog.sh"
          chmod 755 "$APP_DIR/scripts/ops/backups/backup-postgres.sh" \
            "$APP_DIR/scripts/ops/backups/restore-postgres-rehearsal.sh"
          test -s "$APP_DIR/docker-compose.production.yml"
          test -s "$APP_DIR/scripts/ops/backups/backup-postgres.sh"
          test -s "$APP_DIR/scripts/ops/logs/request-log-lookup.sh"
          test -s "$APP_DIR/scripts/ops/host-jobs/container-watchdog.sh"
          test -s "$APP_DIR/.aihub-host-jobs-sync-candidate/install-host-jobs.sh"
          test -s "$APP_DIR/.aihub-host-jobs-sync-candidate/docker-compose.production.yml"
          test -s "$APP_DIR/.aihub-host-jobs-sync-candidate/blue-green-host.sh"
          test -s "$APP_DIR/.aihub-host-jobs-candidate/host-scheduled-job.sh"
          test -s "$APP_DIR/.aihub-host-jobs-candidate/aihub.crontab"
          test -s "$APP_DIR/ops/nginx/aihub-api.conf"
          test -s "$APP_DIR/ops/nginx/sandbox.conf"
          test -s "$APP_DIR/ops/nginx/00-aihub-log-format.conf"
          test -s "$APP_DIR/ops/nginx/aihub-access-logrotate"
          test -s "$APP_DIR/ops/vault/agent/aihub-runtime.hcl"
          test -s "$APP_DIR/ops/vault/templates/runtime-secrets.json.ctmpl"
          test -s "$APP_DIR/ops/vault/templates/auth-mfa-secrets.json.ctmpl"
          test -s "$APP_DIR/ops/vault/templates/connection-secrets.json.ctmpl"
          compose_next="$(mktemp "$APP_DIR/.aihub-compose.XXXXXX")"
          helper_next="$(mktemp "$APP_DIR/scripts/ops/.blue-green-host.XXXXXX")"
          installer_next="$(mktemp "$APP_DIR/scripts/ops/.install-host-jobs.XXXXXX")"
          install -m 644 "$APP_DIR/.aihub-host-jobs-sync-candidate/docker-compose.production.yml" "$compose_next"
          install -m 755 "$APP_DIR/.aihub-host-jobs-sync-candidate/blue-green-host.sh" "$helper_next"
          install -m 755 "$APP_DIR/.aihub-host-jobs-sync-candidate/install-host-jobs.sh" "$installer_next"
          mv -f -- "$installer_next" "$APP_DIR/scripts/ops/host-jobs/install-host-jobs.sh"
          mv -f -- "$compose_next" "$APP_DIR/docker-compose.production.yml"
          mv -f -- "$helper_next" "$APP_DIR/scripts/ops/blue-green/blue-green-host.sh"
          test -s "$APP_DIR/scripts/ops/host-jobs/install-host-jobs.sh"
          cmp -s "$APP_DIR/.aihub-host-jobs-sync-candidate/docker-compose.production.yml" \
            "$APP_DIR/docker-compose.production.yml"
          cmp -s "$APP_DIR/.aihub-host-jobs-sync-candidate/blue-green-host.sh" \
            "$APP_DIR/scripts/ops/blue-green/blue-green-host.sh"
          rm -f -- "$APP_DIR/scripts/ops/blue-green-host.sh"
          REMOTE

      - name: Restore host files and schedule after sync failure
        if: ${{ always() && steps.stale_guard.outputs.outcome == 'deploy' && steps.pause_host_jobs.outcome == 'success' && steps.sync.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          target=aihub-deploy
          ssh_opts=(-F "$AIHUB_SSH_CONFIG")
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          backup="$APP_DIR/.aihub-host-jobs-state/sync-backup"
          if [[ -f "$backup/ready" ]]; then
            case "$(cat "$backup/blue-green-host.path")" in
              scripts/ops/blue-green/blue-green-host.sh|scripts/ops/blue-green-host.sh)
                helper_path="$(cat "$backup/blue-green-host.path")"
                ;;
              *)
                printf 'sync backup has an invalid blue-green helper path\n' >&2
                exit 1
                ;;
            esac
            compose_next="$(mktemp "$APP_DIR/.aihub-compose-restore.XXXXXX")"
            helper_next="$(mktemp "$APP_DIR/scripts/ops/.blue-green-restore.XXXXXX")"
            install -m 644 "$backup/docker-compose.production.yml" "$compose_next"
            install -m 755 "$backup/blue-green-host.sh" "$helper_next"
            mv -f -- "$compose_next" "$APP_DIR/docker-compose.production.yml"
            mv -f -- "$helper_next" "$APP_DIR/$helper_path"
            cmp -s "$backup/docker-compose.production.yml" "$APP_DIR/docker-compose.production.yml"
            cmp -s "$backup/blue-green-host.sh" "$APP_DIR/$helper_path"
            if [[ "$helper_path" == scripts/ops/blue-green-host.sh ]]; then
              rm -f -- "$APP_DIR/scripts/ops/blue-green/blue-green-host.sh"
              rmdir "$APP_DIR/scripts/ops/blue-green" 2>/dev/null || true
            fi
          fi
          rm -f -- "$APP_DIR/.aihub-host-jobs-sync-candidate/blue-green-host.sh" \
            "$APP_DIR/.aihub-host-jobs-sync-candidate/docker-compose.production.yml" \
            "$APP_DIR/.aihub-host-jobs-sync-candidate/install-host-jobs.sh"
          rmdir "$APP_DIR/.aihub-host-jobs-sync-candidate" 2>/dev/null || true
          "$APP_DIR/.aihub-host-jobs-candidate/install-host-jobs.sh" restore
          REMOTE

      - name: Deploy Production and verify caller IP
        if: ${{ steps.stale_guard.outputs.outcome == 'deploy' }}
        id: deploy_production
        shell: bash
        run: |
          set -euo pipefail
          target=aihub-deploy
          ssh_opts=(-F "$AIHUB_SSH_CONFIG")
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          image_arg="$(printf '%q' "$AIHUB_IMAGE")"
          target_sha="${AIHUB_IMAGE##*:}"
          tier_deployed=false
          rollback_tier() {
            local tier_arg
            tier_arg="$(printf '%q' "$1")"
            ssh "${ssh_opts[@]}" "$target" \
              "APP_DIR=$app_dir_arg TIER=$tier_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh rollback "$TIER"
          REMOTE
          }
          verify_request_id() {
            local request_id_arg result remaining deadline=$((SECONDS + 10))
            request_id_arg="$(printf '%q' "$1")"
            while (( (remaining = deadline - SECONDS) > 0 )); do
              if result="$(timeout "${remaining}s" ssh "${ssh_opts[@]}" "$target" \
                "APP_DIR=$app_dir_arg REQUEST_ID=$request_id_arg bash -se" 2>/dev/null <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/logs/request-log-lookup.sh verify "$REQUEST_ID"
          REMOTE
              )" && [[ "$result" == PASS ]]; then
                printf 'PASS\n'
                return 0
              fi
              remaining=$((deadline - SECONDS))
              (( remaining > 0 )) && sleep 1
            done
            printf 'FAIL\n'
            return 1
          }
          state="$(ssh "${ssh_opts[@]}" "$target" \
            "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh status
          REMOTE
          )"
          caller_ip_gate="$(sed -n 's/^caller_ip_gate=//p' <<<"$state")"
          if [[ -n "$caller_ip_gate" && "$caller_ip_gate" != production ]] || \
            grep -Eq '^pending=|^sandbox enabled but not routed$' <<<"$state"; then
            printf 'deployment state is unresolved; refusing to roll out production\n' >&2
            exit 1
          fi
          active_sha="$(awk '$1 == "production" { for (i = 1; i <= NF; i++) if ($i ~ /^sha=/) { sub(/^sha=/, "", $i); print $i; exit } }' <<<"$state")"
          if [[ ! "$active_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'active Production revision is missing or invalid\n' >&2
            exit 1
          fi
          if [[ "$active_sha" == "$target_sha" ]]; then
            printf 'Production already runs target; skipping cutover\n'
          else
            if ! ssh "${ssh_opts[@]}" "$target" \
              "APP_DIR=$app_dir_arg AIHUB_IMAGE=$image_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh deploy production
          REMOTE
            then
              ssh "${ssh_opts[@]}" "$target" \
                "APP_DIR=$app_dir_arg AIHUB_IMAGE=$image_arg bash -se" <<'REMOTE' || true
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh recover-gate
          REMOTE
              exit 1
            fi
            tier_deployed=true
          fi

          if ! public_host="$(ssh "${ssh_opts[@]}" "$target" \
            "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh public-host production
          REMOTE
          )" 2>/dev/null; then
            printf 'FAIL\n'
            if [[ "$tier_deployed" == true ]]; then rollback_tier production; fi
            exit 1
          fi
          if ! request_id="$(node scripts/ops/monitoring/probe-public-edge.cjs request-id "$public_host")"; then
            printf 'FAIL\n'
            if [[ "$tier_deployed" == true ]]; then rollback_tier production; fi
            exit 1
          fi
          if ! verify_request_id "$request_id"; then
            if [[ "$tier_deployed" == true ]]; then rollback_tier production; fi
            exit 1
          fi
          sandbox_enabled="$(ssh "${ssh_opts[@]}" "$target" \
            "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh sandbox-enabled
          REMOTE
          )"
          printf 'sandbox_enabled=%s\n' "$sandbox_enabled" >> "$GITHUB_OUTPUT"

      - name: Deploy Sandbox release and verify caller IP
        id: deploy_sandbox
        if: ${{ steps.stale_guard.outputs.outcome == 'deploy' && steps.deploy_production.outcome == 'success' && steps.deploy_production.outputs.sandbox_enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          target=aihub-deploy
          ssh_opts=(-F "$AIHUB_SSH_CONFIG")
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          image_arg="$(printf '%q' "$AIHUB_IMAGE")"
          target_sha="${AIHUB_IMAGE##*:}"
          tier_deployed=false
          rollback_tier() {
            local tier_arg
            tier_arg="$(printf '%q' "$1")"
            ssh "${ssh_opts[@]}" "$target" \
              "APP_DIR=$app_dir_arg TIER=$tier_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh rollback "$TIER"
          REMOTE
          }
          verify_request_id() {
            local request_id_arg result remaining deadline=$((SECONDS + 10))
            request_id_arg="$(printf '%q' "$1")"
            while (( (remaining = deadline - SECONDS) > 0 )); do
              if result="$(timeout "${remaining}s" ssh "${ssh_opts[@]}" "$target" \
                "APP_DIR=$app_dir_arg REQUEST_ID=$request_id_arg bash -se" 2>/dev/null <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/logs/request-log-lookup.sh verify "$REQUEST_ID"
          REMOTE
              )" && [[ "$result" == PASS ]]; then
                printf 'PASS\n'
                return 0
              fi
              remaining=$((deadline - SECONDS))
              (( remaining > 0 )) && sleep 1
            done
            printf 'FAIL\n'
            return 1
          }
          state="$(ssh "${ssh_opts[@]}" "$target" \
            "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh status
          REMOTE
          )"
          caller_ip_gate="$(sed -n 's/^caller_ip_gate=//p' <<<"$state")"
          if [[ -n "$caller_ip_gate" && "$caller_ip_gate" != production ]] || \
            grep -Eq '^pending=|^sandbox enabled but not routed$' <<<"$state"; then
            printf 'deployment state is unresolved; refusing to roll out Sandbox\n' >&2
            exit 1
          fi
          active_sha="$(awk '$1 == "sandbox" { for (i = 1; i <= NF; i++) if ($i ~ /^sha=/) { sub(/^sha=/, "", $i); print $i; exit } }' <<<"$state")"
          if [[ ! "$active_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'active Sandbox revision is missing or invalid\n' >&2
            exit 1
          fi
          if [[ "$active_sha" == "$target_sha" ]]; then
            printf 'Sandbox already runs target; skipping cutover\n'
          else
            if ! ssh "${ssh_opts[@]}" "$target" \
              "APP_DIR=$app_dir_arg AIHUB_IMAGE=$image_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh deploy sandbox
          REMOTE
            then
              ssh "${ssh_opts[@]}" "$target" \
                "APP_DIR=$app_dir_arg AIHUB_IMAGE=$image_arg bash -se" <<'REMOTE' || true
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh recover-gate
          REMOTE
              exit 1
            fi
            tier_deployed=true
          fi

          if ! public_host="$(ssh "${ssh_opts[@]}" "$target" \
            "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh public-host sandbox
          REMOTE
          )" 2>/dev/null; then
            printf 'FAIL\n'
            if [[ "$tier_deployed" == true ]]; then rollback_tier sandbox; fi
            exit 1
          fi
          if ! request_id="$(node scripts/ops/monitoring/probe-public-edge.cjs request-id "$public_host")"; then
            printf 'FAIL\n'
            if [[ "$tier_deployed" == true ]]; then rollback_tier sandbox; fi
            exit 1
          fi
          if ! verify_request_id "$request_id"; then
            if [[ "$tier_deployed" == true ]]; then rollback_tier sandbox; fi
            exit 1
          fi

      - name: Final public health window
        id: deploy
        if: ${{ steps.stale_guard.outputs.outcome == 'deploy' && steps.deploy_production.outcome == 'success' && (steps.deploy_sandbox.outcome == 'success' || steps.deploy_sandbox.outcome == 'skipped') }}
        shell: bash
        run: |
          set -euo pipefail
          target=aihub-deploy
          ssh_opts=(-F "$AIHUB_SSH_CONFIG")
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          image_arg="$(printf '%q' "$AIHUB_IMAGE")"
          ssh "${ssh_opts[@]}" "$target" \
            "APP_DIR=$app_dir_arg AIHUB_IMAGE=$image_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh finalize
          REMOTE

      - name: Install and smoke the scheduled host jobs
        id: host_jobs
        if: ${{ always() && steps.stale_guard.outputs.outcome == 'deploy' && steps.sync.outcome == 'success' && steps.ssh.outcome == 'success' && steps.pause_host_jobs.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          target=aihub-deploy
          ssh_opts=(-F "$AIHUB_SSH_CONFIG")
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          image_arg="$(printf '%q' "$AIHUB_IMAGE")"
          deploy_outcome="$(printf '%q' "$DEPLOY_OUTCOME")"
          ssh "${ssh_opts[@]}" "$target" \
            "APP_DIR=$app_dir_arg AIHUB_IMAGE=$image_arg DEPLOY_OUTCOME=$deploy_outcome bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          state="$(./scripts/ops/blue-green/blue-green-host.sh status)"
          target_sha="${AIHUB_IMAGE##*:}"
          if grep -Eq '^pending=' <<<"$state" || grep -Fxq 'sandbox enabled but not routed' <<<"$state"; then
            printf 'deployment state is unresolved; AIHUB host jobs remain suspended\n' >&2
            exit 1
          fi
          if grep -Eq '^caller_ip_gate=' <<<"$state"; then
            printf 'caller-IP deployment gate remains unresolved; AIHUB host jobs remain suspended\n' >&2
            exit 1
          fi
          if ! grep -Eq '^production active_slot=' <<<"$state" || ! grep -Eq '^sandbox (active_slot=|disabled$)' <<<"$state"; then
            printf 'could not resolve every AIHUB tier; host jobs remain suspended\n' >&2
            exit 1
          fi
          active_shas=()
          while IFS= read -r line; do
            if [[ "$line" =~ ^(production|sandbox)[[:space:]]active_slot= ]]; then
              if [[ "$line" =~ [[:space:]]sha=([^[:space:]]+) ]]; then
                active_shas+=("${BASH_REMATCH[1]}")
              else
                printf 'an active AIHUB tier revision is missing; host jobs remain suspended\n' >&2
                exit 1
              fi
            fi
          done <<<"$state"
          if (( ${#active_shas[@]} == 0 )); then
            printf 'no active AIHUB tier revisions were reported; host jobs remain suspended\n' >&2
            exit 1
          fi
          for sha in "${active_shas[@]}"; do
            if [[ ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then
              printf 'an active AIHUB tier revision is unknown; host jobs remain suspended\n' >&2
              exit 1
            fi
            if [[ "$sha" != "${active_shas[0]}" ]]; then
              printf 'active AIHUB tiers run mixed revisions; host jobs remain suspended\n' >&2
              exit 1
            fi
          done
          if [[ "${active_shas[0]}" == "$target_sha" ]]; then
            ./scripts/ops/host-jobs/install-host-jobs.sh install
          elif [[ "$DEPLOY_OUTCOME" == success ]]; then
            printf 'successful deployment does not expose the target revision; AIHUB host jobs remain suspended\n' >&2
            exit 1
          else
            ./scripts/ops/host-jobs/install-host-jobs.sh restore
          fi
          REMOTE
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}

      - name: Report active tier revisions
        if: ${{ always() && steps.stale_guard.outputs.outcome == 'deploy' && steps.ssh.outcome == 'success' && steps.sync.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          target=aihub-deploy
          ssh_opts=(-F "$AIHUB_SSH_CONFIG")
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          state="$(ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green/blue-green-host.sh status
          REMOTE
          )"
          printf '## Active tier revisions\n\n%s\n' "$state" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR on VPS
        if: ${{ always() && steps.stale_guard.outputs.outcome == 'deploy' && steps.ghcr_login.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          target=aihub-deploy
          ssh_opts=(-F "$AIHUB_SSH_CONFIG")
          ssh "${ssh_opts[@]}" "$target" "sudo -n docker logout ghcr.io"

      - name: Close shared SSH connection
        if: ${{ always() && steps.stale_guard.outputs.outcome == 'deploy' }}
        shell: bash
        run: |
          if [[ -n "${AIHUB_SSH_CONFIG:-}" && -f "$AIHUB_SSH_CONFIG" ]]; then
            ssh -F "$AIHUB_SSH_CONFIG" -O exit aihub-deploy >/dev/null 2>&1 || true
          fi
