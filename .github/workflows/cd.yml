name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Resolve image tag
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          image_name="ghcr.io/${REPOSITORY,,}"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "image=${image_name}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      AIHUB_IMAGE: ${{ needs.publish.outputs.image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
    steps:
      - name: Configure SSH
        id: ssh
        shell: bash
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_PRIVATE_KEY" > "$HOME/.ssh/aihub-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/aihub-deploy"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Check out deployment manifests
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sync deployment manifests to VPS
        shell: bash
        run: |
          set -eu
          test -n "$VPS_APP_DIR"
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp_opts=(-i "$HOME/.ssh/aihub-deploy" -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$target" \
            "mkdir -p '$VPS_APP_DIR/ops/vault/agent' '$VPS_APP_DIR/ops/vault/templates'"
          scp "${scp_opts[@]}" \
            docker-compose.production.yml \
            "$target:$VPS_APP_DIR/"
          scp "${scp_opts[@]}" \
            ops/vault/agent/aihub-runtime.hcl \
            "$target:$VPS_APP_DIR/ops/vault/agent/"
          scp "${scp_opts[@]}" \
            ops/vault/templates/runtime-secrets.json.ctmpl \
            ops/vault/templates/connection-secrets.json.ctmpl \
            "$target:$VPS_APP_DIR/ops/vault/templates/"
          ssh "${ssh_opts[@]}" "$target" \
            "test -s '$VPS_APP_DIR/docker-compose.production.yml' && test -s '$VPS_APP_DIR/ops/vault/agent/aihub-runtime.hcl' && test -s '$VPS_APP_DIR/ops/vault/templates/runtime-secrets.json.ctmpl' && test -s '$VPS_APP_DIR/ops/vault/templates/connection-secrets.json.ctmpl'"

      - name: Log in to GHCR on VPS
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -eu
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_PULL_TOKEN"
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          printf '%s' "$GHCR_PULL_TOKEN" | ssh "${ssh_opts[@]}" "$target" \
            "sudo -n docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy release
        shell: bash
        run: |
          set -eu
          test -n "$VPS_APP_DIR"
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          image_arg="$(printf '%q' "$AIHUB_IMAGE")"
          ssh "${ssh_opts[@]}" "$target" \
            "APP_DIR=$app_dir_arg AIHUB_IMAGE=$image_arg bash -se" <<'REMOTE'
          set -eu
          cd "$APP_DIR"
          env_tmp="$(mktemp .env.production.tmp.XXXXXX)"
          trap 'rm -f "$env_tmp"' EXIT
          awk '!/^AIHUB_IMAGE=/' .env.production >"$env_tmp"
          printf 'AIHUB_IMAGE=%s\n' "$AIHUB_IMAGE" >>"$env_tmp"
          chmod 600 "$env_tmp"
          mv "$env_tmp" .env.production
          trap - EXIT
          compose=(sudo -n docker compose --env-file .env.production -f docker-compose.production.yml)

          "${compose[@]}" config --quiet

          sandbox_enabled="$(sed -n 's/^AIHUB_SANDBOX_ENABLED=//p' .env.production)"
          if [ -n "$sandbox_enabled" ] && [ "$sandbox_enabled" != true ] && [ "$sandbox_enabled" != false ]; then
            printf 'AIHUB_SANDBOX_ENABLED must be true or false\n' >&2
            exit 1
          fi
          sandbox_keys=(AIHUB_SANDBOX_HOST AIHUB_SANDBOX_ORG_IDS)
          sandbox_set=0
          if [ "$sandbox_enabled" = true ]; then
            for key in "${sandbox_keys[@]}"; do
              if grep -Eq "^${key}=.+$" .env.production; then
                sandbox_set=$((sandbox_set + 1))
              fi
            done
          fi
          if [ "$sandbox_enabled" = true ] && [ "$sandbox_set" -ne "${#sandbox_keys[@]}" ]; then
            printf 'sandbox configuration must set AIHUB_SANDBOX_ENABLED=true, AIHUB_SANDBOX_HOST, and AIHUB_SANDBOX_ORG_IDS together\n' >&2
            exit 1
          fi

          # Do not recreate the Agent during CD: its AppRole secret_id is
          # single-use, and a fresh one must be staged by an operator.
          vault_container_id="$("${compose[@]}" ps -q vault-agent)"
          if [ -z "$vault_container_id" ]; then
            printf 'vault-agent container is missing; refusing to create it without a fresh AppRole secret_id\n' >&2
            exit 1
          fi
          vault_running="$(sudo -n docker inspect --format '{{.State.Running}}' "$vault_container_id" 2>/dev/null || true)"
          if [ "$vault_running" != true ]; then
            printf 'vault-agent is not running; refusing to recreate it without a fresh AppRole secret_id\n' >&2
            "${compose[@]}" logs --no-color --tail=100 vault-agent >&2 || true
            exit 1
          fi
          if ! sudo -n docker exec "$vault_container_id" sh -ec '
            test -s /run/secrets/aihub/runtime-secrets.json || { echo "runtime-secrets.json is missing or empty" >&2; exit 1; }
            test -s /run/secrets/aihub/connection-secrets.json || { echo "connection-secrets.json is missing or empty" >&2; exit 1; }
            wget -q -T 2 -O /dev/null "http://127.0.0.1:8220/agent/v1/metrics?format=prometheus"
          '; then
            printf 'vault-agent is running but its rendered bundles or metrics endpoint failed checks\n' >&2
            "${compose[@]}" logs --no-color --tail=100 vault-agent >&2 || true
            exit 1
          fi
          # Render timestamps prove nothing here: the Agent only rewrites a
          # template when its rendered bytes change, and the Agent is not
          # recreated, so an unchanged secret correctly keeps an old mtime.
          # What must hold is that the live AppRole session still works. The
          # role issues one-hour tokens, so a success or renewal inside the
          # last hour means the deploy never needed a hand-issued secret_id.
          # The deployed metrics endpoint does not expose the authenticated
          # gauge, so the direct checks above and this auth-log guard replace
          # the Compose service_healthy gate for this rollout.
          vault_logs="$("${compose[@]}" logs --no-color --since 1h vault-agent 2>&1 || true)"
          case "$vault_logs" in
            *"authentication successful"* | *"renewed auth token"*) ;;
            *)
              printf 'vault-agent has not authenticated in the last hour; auto-auth is failing\n' >&2
              printf '%s\n' "$vault_logs" | tail -100 >&2
              exit 1
              ;;
          esac

          services=(app)
          compose_runtime=("${compose[@]}")
          if [ "$sandbox_enabled" = true ]; then
            "${compose[@]}" --profile sandbox pull app app-sandbox
            # Host nginx terminates TLS and owns ports 80/443 on this VPS. The
            # sandbox app binds a second loopback port; nginx publishes the
            # configured hostname and never a wildcard or catch-all.
            services+=(app-sandbox)
            compose_runtime+=(--profile sandbox)
          else
            # Removing the service prevents a stale sandbox container from
            # surviving after its deployment configuration is disabled. Host
            # nginx remains an explicit operator-managed configuration.
            "${compose[@]}" --profile sandbox rm --stop --force app-sandbox </dev/null || true
            "${compose[@]}" pull app
          fi

          "${compose[@]}" --profile migration run --no-deps --rm migrate </dev/null
          if [ "$sandbox_enabled" = true ]; then
            "${compose[@]}" --profile migration --profile sandbox run --no-deps --rm migrate-sandbox </dev/null
          fi

          "${compose_runtime[@]}" up -d --no-deps --no-build "${services[@]}"

          for service in "${services[@]}"; do
            container_id="$("${compose_runtime[@]}" ps -q "$service")"
            test -n "$container_id"
            healthy=0
            status=""
            for attempt in $(seq 1 45); do
              status="$(sudo -n docker inspect --format '{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)"
              if [ "$status" = healthy ]; then
                healthy=1
                break
              fi
              if [ "$status" = unhealthy ]; then
                break
              fi
              sleep 2
            done
            if [ "$healthy" -ne 1 ]; then
              "${compose_runtime[@]}" ps
              printf '%s health status: %s\n' "$service" "$status" >&2
              sudo -n docker inspect --format \
                'container state={{.State.Status}} exit_code={{.State.ExitCode}} error={{.State.Error}} restart_count={{.RestartCount}}' \
                "$container_id" >&2 || true
              sudo -n docker inspect --format \
                '{{range .State.Health.Log}}healthcheck exit_code={{.ExitCode}} output={{printf "%q" .Output}}\n{{end}}' \
                "$container_id" >&2 || true
              "${compose_runtime[@]}" logs --no-color --tail=100 "$service" >&2 || true
              exit 1
            fi
          done

          REMOTE

      - name: Log out of GHCR on VPS
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$target" "sudo -n docker logout ghcr.io >/dev/null 2>&1 || true"
