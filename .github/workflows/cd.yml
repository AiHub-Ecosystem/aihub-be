name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
      actions: read
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Download the digest CI published
        uses: actions/download-artifact@v8
        with:
          name: image-digest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Check the registry still holds the image CI booted
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image_name="ghcr.io/${REPOSITORY,,}"
          image="${image_name}:${IMAGE_TAG}"
          expected="$(tr -d '[:space:]' < image-digest.txt)"
          actual="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image")"
          test -n "$actual"
          printf 'CI published: %s\nregistry holds:  %s\nimage:          %s\n' \
            "$expected" "$actual" "$image"
          if [ "$expected" != "$actual" ]; then
            printf 'image digest mismatch: refusing to deploy %s\n' "$image" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    name: Blue-green deploy to VPS
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      AIHUB_IMAGE: ${{ needs.resolve.outputs.image }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
    steps:
      - name: Check out the image source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # `workflow_run` checks out the completed run's commit above. Keep the
      # guard itself from the current default-branch workflow so old reruns
      # cannot lack the guard implementation.
      - name: Check out the deployment guard
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .cd-guard
          fetch-depth: 0

      - name: Reject a stale CI revision before contacting the host
        working-directory: .cd-guard
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          if [ "$source_sha" != "$DEPLOY_SHA" ]; then
            printf 'refusing to deploy: checked-out image source %s does not match CI run %s\n' \
              "$source_sha" "$DEPLOY_SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$DEPLOY_SHA" != "$main_sha" ]; then
            printf 'refusing to deploy %s: it is not the current main tip (%s)\n' \
              "$DEPLOY_SHA" "$main_sha" >&2
            exit 1
          fi

      - name: Configure SSH
        id: ssh
        shell: bash
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_PRIVATE_KEY" > "$HOME/.ssh/aihub-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/aihub-deploy"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Check host revisions and recheck main before writes
        id: target_guard
        working-directory: .cd-guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_APP_DIR"
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          state="$(ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green-host.sh status
          REMOTE
          )"
          printf 'Host revisions before deployment:\n%s\n' "$state"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          printf '%s\n' "$state" | node scripts/ci/deploy-target-guard.cjs "$DEPLOY_SHA" "$main_sha"

      - name: Stage host job installer
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_APP_DIR"
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp_opts=(-i "$HOME/.ssh/aihub-deploy" -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$APP_DIR/.aihub-host-jobs-candidate"
          REMOTE
          scp "${scp_opts[@]}" \
            scripts/ops/install-host-jobs.sh \
            "$target:$VPS_APP_DIR/.aihub-host-jobs-candidate/install-host-jobs.sh"
          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          chmod 755 "$APP_DIR/.aihub-host-jobs-candidate/install-host-jobs.sh"
          test -s "$APP_DIR/.aihub-host-jobs-candidate/install-host-jobs.sh"
          REMOTE

      - name: Log in to GHCR on VPS
        id: ghcr_login
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -eu
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_PULL_TOKEN"
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          printf '%s' "$GHCR_PULL_TOKEN" | ssh "${ssh_opts[@]}" "$target" \
            "sudo -n docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Pause and drain AIHUB host jobs
        id: pause_host_jobs
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          "$APP_DIR/.aihub-host-jobs-candidate/install-host-jobs.sh" suspend
          REMOTE

      - name: Sync deployment files to VPS
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp_opts=(-i "$HOME/.ssh/aihub-deploy" -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -eu
          test -d "$APP_DIR/.aihub-host-jobs-state"
          sync_candidate="$APP_DIR/.aihub-host-jobs-sync-candidate"
          sync_backup="$APP_DIR/.aihub-host-jobs-state/sync-backup"
          mkdir -p "$sync_candidate" "$sync_backup"
          rm -f -- "$sync_candidate/blue-green-host.sh" \
            "$sync_candidate/docker-compose.production.yml" \
            "$sync_backup/blue-green-host.sh" \
            "$sync_backup/docker-compose.production.yml" \
            "$sync_backup/ready"
          cp -p -- "$APP_DIR/scripts/ops/blue-green-host.sh" "$sync_backup/blue-green-host.sh"
          cp -p -- "$APP_DIR/docker-compose.production.yml" "$sync_backup/docker-compose.production.yml"
          : >"$sync_backup/ready"
          chmod 600 "$sync_backup/ready"
          mkdir -p "$APP_DIR/scripts/ops" "$APP_DIR/ops/nginx" \
            "$APP_DIR/ops/vault/agent" "$APP_DIR/ops/vault/templates" \
            "$APP_DIR/ops/host-jobs" "$APP_DIR/.aihub-host-jobs-candidate"
          REMOTE
          scp "${scp_opts[@]}" \
            docker-compose.production.yml \
            "$target:$VPS_APP_DIR/.aihub-host-jobs-sync-candidate/"
          scp "${scp_opts[@]}" \
            scripts/ops/install-host-jobs.sh \
            "$target:$VPS_APP_DIR/.aihub-host-jobs-sync-candidate/"
          scp "${scp_opts[@]}" \
            scripts/ops/blue-green-host.sh \
            "$target:$VPS_APP_DIR/.aihub-host-jobs-sync-candidate/"
          scp "${scp_opts[@]}" \
            scripts/ops/host-scheduled-job.sh \
            ops/host-jobs/aihub.crontab \
            "$target:$VPS_APP_DIR/.aihub-host-jobs-candidate/"
          scp "${scp_opts[@]}" \
            ops/nginx/aihub-api.conf \
            ops/nginx/sandbox.conf \
            ops/nginx/00-aihub-log-format.conf \
            ops/nginx/aihub-access-logrotate \
            "$target:$VPS_APP_DIR/ops/nginx/"
          scp "${scp_opts[@]}" \
            ops/vault/agent/aihub-runtime.hcl \
            "$target:$VPS_APP_DIR/ops/vault/agent/"
          scp "${scp_opts[@]}" \
            ops/vault/templates/runtime-secrets.json.ctmpl \
            ops/vault/templates/auth-mfa-secrets.json.ctmpl \
            ops/vault/templates/connection-secrets.json.ctmpl \
            "$target:$VPS_APP_DIR/ops/vault/templates/"
          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -eu
          chmod 755 "$APP_DIR/scripts/ops/blue-green-host.sh"
          test -s "$APP_DIR/docker-compose.production.yml"
          test -s "$APP_DIR/scripts/ops/blue-green-host.sh"
          test -s "$APP_DIR/.aihub-host-jobs-sync-candidate/install-host-jobs.sh"
          test -s "$APP_DIR/.aihub-host-jobs-sync-candidate/docker-compose.production.yml"
          test -s "$APP_DIR/.aihub-host-jobs-sync-candidate/blue-green-host.sh"
          test -s "$APP_DIR/.aihub-host-jobs-candidate/host-scheduled-job.sh"
          test -s "$APP_DIR/.aihub-host-jobs-candidate/aihub.crontab"
          test -s "$APP_DIR/ops/nginx/aihub-api.conf"
          test -s "$APP_DIR/ops/nginx/sandbox.conf"
          test -s "$APP_DIR/ops/nginx/00-aihub-log-format.conf"
          test -s "$APP_DIR/ops/nginx/aihub-access-logrotate"
          test -s "$APP_DIR/ops/vault/agent/aihub-runtime.hcl"
          test -s "$APP_DIR/ops/vault/templates/runtime-secrets.json.ctmpl"
          test -s "$APP_DIR/ops/vault/templates/auth-mfa-secrets.json.ctmpl"
          test -s "$APP_DIR/ops/vault/templates/connection-secrets.json.ctmpl"
          compose_next="$(mktemp "$APP_DIR/.aihub-compose.XXXXXX")"
          helper_next="$(mktemp "$APP_DIR/scripts/ops/.blue-green-host.XXXXXX")"
          installer_next="$(mktemp "$APP_DIR/scripts/ops/.install-host-jobs.XXXXXX")"
          install -m 644 "$APP_DIR/.aihub-host-jobs-sync-candidate/docker-compose.production.yml" "$compose_next"
          install -m 755 "$APP_DIR/.aihub-host-jobs-sync-candidate/blue-green-host.sh" "$helper_next"
          install -m 755 "$APP_DIR/.aihub-host-jobs-sync-candidate/install-host-jobs.sh" "$installer_next"
          mv -f -- "$installer_next" "$APP_DIR/scripts/ops/install-host-jobs.sh"
          mv -f -- "$compose_next" "$APP_DIR/docker-compose.production.yml"
          mv -f -- "$helper_next" "$APP_DIR/scripts/ops/blue-green-host.sh"
          test -s "$APP_DIR/scripts/ops/install-host-jobs.sh"
          cmp -s "$APP_DIR/.aihub-host-jobs-sync-candidate/docker-compose.production.yml" \
            "$APP_DIR/docker-compose.production.yml"
          cmp -s "$APP_DIR/.aihub-host-jobs-sync-candidate/blue-green-host.sh" \
            "$APP_DIR/scripts/ops/blue-green-host.sh"
          REMOTE

      - name: Restore host files and schedule after sync failure
        if: ${{ always() && steps.pause_host_jobs.outcome == 'success' && steps.sync.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          backup="$APP_DIR/.aihub-host-jobs-state/sync-backup"
          if [[ -f "$backup/ready" ]]; then
            compose_next="$(mktemp "$APP_DIR/.aihub-compose-restore.XXXXXX")"
            helper_next="$(mktemp "$APP_DIR/scripts/ops/.blue-green-restore.XXXXXX")"
            install -m 644 "$backup/docker-compose.production.yml" "$compose_next"
            install -m 755 "$backup/blue-green-host.sh" "$helper_next"
            mv -f -- "$compose_next" "$APP_DIR/docker-compose.production.yml"
            mv -f -- "$helper_next" "$APP_DIR/scripts/ops/blue-green-host.sh"
            cmp -s "$backup/docker-compose.production.yml" "$APP_DIR/docker-compose.production.yml"
            cmp -s "$backup/blue-green-host.sh" "$APP_DIR/scripts/ops/blue-green-host.sh"
          fi
          rm -f -- "$APP_DIR/.aihub-host-jobs-sync-candidate/blue-green-host.sh" \
            "$APP_DIR/.aihub-host-jobs-sync-candidate/docker-compose.production.yml" \
            "$APP_DIR/.aihub-host-jobs-sync-candidate/install-host-jobs.sh"
          rmdir "$APP_DIR/.aihub-host-jobs-sync-candidate" 2>/dev/null || true
          "$APP_DIR/.aihub-host-jobs-candidate/install-host-jobs.sh" restore
          REMOTE

      - name: Deploy release
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          image_arg="$(printf '%q' "$AIHUB_IMAGE")"
          ssh "${ssh_opts[@]}" "$target" \
            "APP_DIR=$app_dir_arg AIHUB_IMAGE=$image_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green-host.sh deploy
          REMOTE

      - name: Install and smoke the scheduled host jobs
        id: host_jobs
        if: ${{ always() && steps.sync.outcome == 'success' && steps.ssh.outcome == 'success' && steps.pause_host_jobs.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          image_arg="$(printf '%q' "$AIHUB_IMAGE")"
          deploy_outcome="$(printf '%q' "$DEPLOY_OUTCOME")"
          ssh "${ssh_opts[@]}" "$target" \
            "APP_DIR=$app_dir_arg AIHUB_IMAGE=$image_arg DEPLOY_OUTCOME=$deploy_outcome bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          state="$(./scripts/ops/blue-green-host.sh status)"
          target_sha="${AIHUB_IMAGE##*:}"
          if grep -Eq '^pending=' <<<"$state" || grep -Fxq 'sandbox enabled but not routed' <<<"$state"; then
            printf 'deployment state is unresolved; AIHUB host jobs remain suspended\n' >&2
            exit 1
          fi
          if ! grep -Eq '^production active_slot=' <<<"$state" || ! grep -Eq '^sandbox (active_slot=|disabled$)' <<<"$state"; then
            printf 'could not resolve every AIHUB tier; host jobs remain suspended\n' >&2
            exit 1
          fi
          active_shas=()
          while IFS= read -r line; do
            if [[ "$line" =~ ^(production|sandbox)[[:space:]]active_slot= ]]; then
              if [[ "$line" =~ [[:space:]]sha=([^[:space:]]+) ]]; then
                active_shas+=("${BASH_REMATCH[1]}")
              else
                printf 'an active AIHUB tier revision is missing; host jobs remain suspended\n' >&2
                exit 1
              fi
            fi
          done <<<"$state"
          if (( ${#active_shas[@]} == 0 )); then
            printf 'no active AIHUB tier revisions were reported; host jobs remain suspended\n' >&2
            exit 1
          fi
          for sha in "${active_shas[@]}"; do
            if [[ ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then
              printf 'an active AIHUB tier revision is unknown; host jobs remain suspended\n' >&2
              exit 1
            fi
            if [[ "$sha" != "${active_shas[0]}" ]]; then
              printf 'active AIHUB tiers run mixed revisions; host jobs remain suspended\n' >&2
              exit 1
            fi
          done
          if [[ "${active_shas[0]}" == "$target_sha" ]]; then
            ./scripts/ops/install-host-jobs.sh install
          elif [[ "$DEPLOY_OUTCOME" == success ]]; then
            printf 'successful deployment does not expose the target revision; AIHUB host jobs remain suspended\n' >&2
            exit 1
          else
            ./scripts/ops/install-host-jobs.sh restore
          fi
          REMOTE
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}

      - name: Report active tier revisions
        if: ${{ always() && steps.ssh.outcome == 'success' && steps.sync.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          app_dir_arg="$(printf '%q' "$VPS_APP_DIR")"
          state="$(ssh "${ssh_opts[@]}" "$target" "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/ops/blue-green-host.sh status
          REMOTE
          )"
          printf '## Active tier revisions\n\n%s\n' "$state" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR on VPS
        if: ${{ always() && steps.ghcr_login.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          target="$VPS_USER@$VPS_HOST"
          ssh_opts=(-i "$HOME/.ssh/aihub-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$target" "sudo -n docker logout ghcr.io"
