name: CI

on:
  # Deliberately unfiltered: a pull request always reports a check, whatever it
  # touches. Filtering here would skip the workflow instead of passing it, and
  # a required check that never runs blocks the pull request forever.
  pull_request:
    branches: [main]

  # Markdown is skipped unless a tracked spec or the Public API release gate
  # reads it. The CI path-filter spec compares this allowlist with Markdown
  # paths found in test sources plus the release gate's CHANGELOG.md.
  push:
    branches: [main]
    paths:
      - "**"
      - "!.claude/**"
      - "!.gitattributes"
      - "!.gitignore"
      - "!*.md"
      - "!**/*.md"
      - "CHANGELOG.md"
      - "docs/adr/0060-writing-task1-sample-image-is-published-not-signed.md"
      - "docs/history/aihub-deliverable-1-historical-contract.md"
      - "docs/integration-guide.md"
      - "docs/local-demo.md"
      - "docs/operations/ci-boot-check.md"
      - "docs/operations/deploy-vps.md"
      - "docs/operations/image-sbom-provenance.md"
      - "docs/operations/image-vulnerability-scanning.md"
      - "ops/vault/README.md"

  workflow_dispatch:
    inputs:
      run_outbox_evaluation:
        description: Run the isolated zero-table outbox comparison
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan changed commits
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # #1779: which commits to scan is a tested decision, not an inline
          # branch. A manual run has no range of its own, so it is refused
          # rather than falling through to a scan of the whole history.
          # Parsed with node, which this step already needs, so the job gains
          # no jq dependency it does not otherwise declare.
          plan=$(node scripts/ci/secret-scan/secret-scan-plan.mjs)
          mode=$(node -p 'JSON.parse(process.argv[1]).mode' "$plan")

          case "$mode" in
            range)
              range=$(node -p 'JSON.parse(process.argv[1]).range' "$plan")
              echo "Scanning $range"
              gitleaks git --config .gitleaks.toml --redact --no-banner \
                --log-opts="$range"
              ;;
            full-history)
              echo "Scanning the whole history: this push carried no usable base."
              gitleaks git --config .gitleaks.toml --redact --no-banner
              ;;
            refused)
              echo "::error::$(node -p 'JSON.parse(process.argv[1]).message' "$plan")"
              exit 1
              ;;
            *)
              echo "::error::unexpected secret-scan plan: $mode"
              exit 1
              ;;
          esac

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # #1786: the commit-message range check lints base..head, so the
          # checkout needs the base commit a shallow clone would not have.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        run: npm install --global bun@1.4.4-canary.20261109.1

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check unused exports
        run: bun run knip

      - name: Lint source
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Type-check
        run: bun run type-check

      - name: Check migrations
        run: bun run check:migrations

      - name: Check deprecation descriptors
        run: bun run check:deprecation

      - name: Check architecture
        run: bun run arch-check

      - name: Check import style
        run: bun run check:imports

      # #941: static job runs the checks verify runs so regressions cannot pass CI.
      - name: Check application errors
        run: bun run check:app-errors

      - name: Check data dictionary
        run: bun run check:data-dictionary

      - name: Check file sizes
        run: bun run check:file-size

      - name: Check domain globals
        run: bun run check:domain-globals

      - name: Check tenant globals
        run: bun run check:tenant-global

      - name: Check data ownership
        run: bun run check:data-ownership

      - name: Check documentation drift
        run: bun run check:doc-drift

      # #1786: these suites ran only inside the local check:batch loop, so a
      # regression in the checkers they pin stayed invisible in CI.
      - name: Check the hook and drift suites CI owns
        run: bun run test:issue-triage && bun run test:lint-staged && bun run test:check-staged && bun run test:doc-drift && bun run test:commit-message

      # #1786: the commit-message gate exists only at hook time, so a
      # --no-verify commit landed a non-Conventional header with nothing to
      # catch it. This lints exactly the range the trigger changes, through
      # the hook script itself; a range-less trigger is skipped with a reason.
      - name: Check commit messages on the changed range
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          COMMIT_EVENT: ${{ github.event_name }}
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.sha }}
        run: node scripts/ci/commit-messages/check-commit-messages.mjs

      - name: Generate and validate OpenAPI
        run: bun run generate:openapi && bun run validate:openapi

      # #1789: every generator writes deterministically, so a regenerated
      # artifact that differs from the committed file is a stale contract
      # shipping. The check regenerates all three and asserts the clean tree;
      # it runs here, in a required job, because it rewrites the artifact
      # files and must never run over a developer's uncommitted work.
      - name: Check generated artifacts match the committed tree
        run: node scripts/ci/generated-drift/check-generated-drift.mjs

      # The release gate runs on pushes to main too (#1398): work lands there
      # directly, and CD deploys whatever contract a push carries. A push
      # compares with the last revision CD deployed, not the commit before it:
      # a red push never deploys, so the next push still owes the whole change
      # since production and a per-push base would call its bump the wrong size.
      # A repository CD has never succeeded in falls back to the commit before
      # the push; a new branch has none to compare.
      - name: Install oasdiff
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.34.1 --repo oasdiff/oasdiff --pattern "oasdiff_1.34.1_linux_amd64.tar.gz" --output "$RUNNER_TEMP/oasdiff.tar.gz" || \
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/oasdiff.tar.gz" \
            https://github.com/oasdiff/oasdiff/releases/download/v1.34.1/oasdiff_1.34.1_linux_amd64.tar.gz
          echo '75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90  '"$RUNNER_TEMP/oasdiff.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "$RUNNER_TEMP/oasdiff" >> "$GITHUB_PATH"

      - name: Resolve the base contract revision
        id: base
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            sha="$PULL_REQUEST_BASE"
          else
            sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cd.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
            sha="${sha:-$PUSH_BEFORE}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the base contract
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base-contract
          persist-credentials: false

      - name: Test API compatibility checker
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        run: bun run test:api-compatibility

      - name: Check public API compatibility
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        run: bun run check:api-compatibility -- base-contract . CHANGELOG.md

      - name: Install nginx for the edge compression check
        run: sudo apt-get update && sudo apt-get install --yes nginx logrotate

      - name: Verify scoped Speaking JSON gzip
        run: bash ops/nginx/check-gzip.sh

      - name: Check nginx configuration headers
        run: bun run check:nginx-headers

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        run: npm install --global bun@1.4.4-canary.20261109.1

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Find the latest completed main CI run
        id: flaky-history-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure") | .id][0] // empty')"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Restore recent flaky-test history
        if: steps.flaky-history-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flaky-test-history
          run-id: ${{ steps.flaky-history-run.outputs.run_id }}
          path: temp/flaky-tests
          github-token: ${{ github.token }}

      # Bun owns assertions; Jest/SWC still emits the branch coverage report
      # consumed by the merged-coverage gate.
      - name: Generate the runtime Prisma client
        run: node scripts/generate/generate-prisma-client.mjs --runtime

      - name: Run unit tests with retries and flakiness tracking
        run: node scripts/ci/flaky-tests/run.mjs
        env:
          AIHUB_FLAKY_TEST_RETRIES: 2
          AIHUB_FLAKY_RATE_THRESHOLD: 0.05

      - name: Generate the unit coverage report with Jest
        run: bun run coverage:unit

      - name: Upload the unit lane coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: coverage/unit/coverage-final.json
          if-no-files-found: error
          # Consumed by the `coverage` job in this same run and never after.
          retention-days: 1

      - name: Test monitoring config checker
        run: bun run test:monitoring-config

      - name: Test the changed-file gate map
        run: bun run test:check-changed

      - name: Upload flaky-test history and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-test-history
          path: |
            temp/flaky-tests/history.json
            temp/flaky-tests/report.json
          if-no-files-found: ignore
          retention-days: 90

  shell-specs:
    name: Shell specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        run: npm install --global bun@1.4.4-canary.20261109.1

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the runtime Prisma client
        run: node scripts/generate/generate-prisma-client.mjs --runtime

      - name: Exercise scheduled host job wrappers with stubs
        run: bash scripts/ops/host-jobs/host-scheduled-job.spec.sh

      - name: Exercise the container watchdog with stubs
        run: bash scripts/ops/host-jobs/container-watchdog.spec.sh

      - name: Exercise the Postgres backup job with stubs
        run: bash scripts/ops/backups/backup-postgres.spec.sh

      - name: Exercise the external port probe with stubs
        run: bash scripts/ops/monitoring/probe-public-ports.spec.sh

      - name: Exercise the alert rule drift check with stubs
        run: bash scripts/ops/monitoring/check-alert-rule-drift.spec.sh

      - name: Exercise the published-port guard in a throwaway network namespace
        run: bash scripts/ops/firewall/docker-user-guard.spec.sh

      - name: Exercise request log lookup with fixtures and stubs
        run: bash test/cli/request-log-lookup.spec.sh

      - name: Exercise nginx upstream selection for port and socket slots
        run: bash test/ops/blue-green-upstream.spec.sh

      - name: Exercise nginx and Compose retention across rollback
        run: bash test/ops/blue-green-config-retention.spec.sh

      - name: Exercise rollback image sourcing without a registry login
        run: bash test/ops/blue-green-rollback-image.spec.sh

      - name: Exercise resuming a half-deployed release past the caller-IP gate
        run: bash test/ops/blue-green-resume.spec.sh

      - name: Exercise deployed status readiness reporting with stubs
        run: bash test/ops/status-readiness.spec.sh

      - name: Exercise blue-green readiness probes across image revisions
        run: bash test/ops/blue-green-readiness.spec.sh

      - name: Exercise edge probe failure tolerance and sustained outage detection
        run: bash test/ops/blue-green-edge-monitor.spec.sh

      - name: Exercise Speaking gateway smoke identity handling with stubs
        run: bash test/ops/speaking-gateway-smoke.spec.sh

  dev-restart-budget:
    name: Dev restart budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        run: npm install --global bun@1.4.4-canary.20261109.1

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up pnpm for the measured dev command
        run: npm install --global pnpm@11.20.0

      - name: Test restart benchmark cleanup and isolation
        run: node --test test/cli/dev-restart-benchmark.spec.mjs

      - name: Run service-free dev restart benchmark
        run: bun run benchmark:dev-restart

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        run: npm install --global bun@1.4.4-canary.20261109.1

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Check build output imports
        run: bun run check:imports:dist

  customer-web-contract:
    name: Customer Web contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out AIHUB candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find a linked Customer Web pull request
        id: customer-web-pr
        if: github.event_name == 'pull_request'
        shell: bash
        # The body is read from the event file, not passed as `env:`: GitHub
        # prints a step's env in the log, and a Dependabot body is pages of
        # release notes.
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const matches = [...(event.pull_request?.body ?? '').matchAll(
            /https:\/\/github\.com\/AiHub-Ecosystem\/AiHub-Frontend\/pull\/(\d+)/g,
          )];
          const numbers = [...new Set(matches.map((match) => match[1]))];
          if (numbers.length > 1) throw new Error('Link only one Customer Web pull request.');
          const found = numbers.length === 1;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `found=${found}\n`);
          if (found) fs.appendFileSync(process.env.GITHUB_OUTPUT, `number=${numbers[0]}\n`);
          NODE

      - name: Check out Customer Web dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AiHub-Ecosystem/AiHub-Frontend
          ref: dev
          path: customer-web
          persist-credentials: false

      - name: Check out linked Customer Web pull request
        if: steps.customer-web-pr.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AiHub-Ecosystem/AiHub-Frontend
          ref: refs/pull/${{ steps.customer-web-pr.outputs.number }}/head
          path: customer-web-linked
          persist-credentials: false

      # #1399: Customer Web checks run on active Node 22 LTS (Node 20 reached
      # EOL on 2026-03-24). Both dev and linked PR paths execute under this
      # runtime without engine restrictions (AiHub-Frontend declares no
      # engines.node in package.json).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Customer Web dependencies
        working-directory: customer-web
        run: npm ci --ignore-scripts

      - name: Install the browser used by Customer Web E2E
        working-directory: customer-web
        run: npx playwright install --with-deps chromium

      - name: Check candidate error codes against Customer Web dev
        working-directory: customer-web
        env:
          AIHUB_OPENAPI_CANDIDATE: ${{ github.workspace }}/openapi/v1.json
        run: npm run check:aihub-contract

      - name: Check candidate responses against Customer Web dev
        working-directory: customer-web
        env:
          AIHUB_OPENAPI_PATH: ${{ github.workspace }}/openapi/v1.json
        run: npm run test:e2e

      - name: Install linked Customer Web dependencies
        if: steps.customer-web-pr.outputs.found == 'true'
        working-directory: customer-web-linked
        run: npm ci --ignore-scripts

      - name: Check candidate error codes against linked Customer Web pull request
        if: steps.customer-web-pr.outputs.found == 'true'
        working-directory: customer-web-linked
        env:
          AIHUB_OPENAPI_CANDIDATE: ${{ github.workspace }}/openapi/v1.json
        run: npm run check:aihub-contract

      - name: Check candidate responses against linked Customer Web pull request
        if: steps.customer-web-pr.outputs.found == 'true'
        working-directory: customer-web-linked
        env:
          AIHUB_OPENAPI_PATH: ${{ github.workspace }}/openapi/v1.json
        run: npm run test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        run: npm install --global bun@1.4.4-canary.20261109.1

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun audit --prod --audit-level=high

  database:
    name: Database lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDIS_URL: redis://localhost:6379/14
      AIHUB_PGBOUNCER_TEST_URL: postgres://aihub:change-me@localhost:6432/aihub_db_lane

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: aihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub -d aihub && psql -U aihub -d aihub -q -v ON_ERROR_STOP=1 -c 'ALTER DATABASE aihub SET aihub.test_lane_marker TO aihub_db_lane_v1; ALTER ROLE aihub SET statement_timeout TO 4000; ALTER ROLE aihub SET lock_timeout TO 1000; ALTER ROLE aihub SET idle_in_transaction_session_timeout TO 10000' >/dev/null"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli SET aihub:test-lane:owner aihub-db-lane-v1 >/dev/null && redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.1-p0
        env:
          DATABASE_URL: postgres://aihub:change-me@postgres:5432/aihub_db_lane
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_CLIENT_CONN: "64"
          DEFAULT_POOL_SIZE: "20"
          MAX_DB_CONNECTIONS: "2"
          MAX_PREPARED_STATEMENTS: "100"
          QUERY_WAIT_TIMEOUT: "0.25"
          LISTEN_PORT: "5432"
        ports:
          - 6432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U aihub -d aihub_db_lane"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        run: npm install --global bun@1.4.4-canary.20261109.1

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enable bounded logical WAL for the database lane
        uses: ./.github/actions/enable-bounded-logical-wal

      # The operator CLI smoke test spawns `scripts/cli/cli.mjs`, which loads its
      # API-key generator and command runners from the build.
      - name: Build application
        run: bun run build

      # Runs apart from `bun run verify`: the default lane must keep passing with
      # no database present, and this one proves the SQL those tests can only
      # describe.
      # No DB_LANE_ADMIN_URL: the service credentials above deliberately match
      # the lane's default in test/db/shared/database.ts, so CI exercises the same path
      # a developer does and a broken default fails here too.
      #
      # This lane is deliberately NOT also asked to run the unit suite: it sets
      # REDIS_URL, so running the unit suite here left the lane's rate limiter
      # counters in Redis and that suite answered 429 where it expected 200.
      # The unit lane's report travels from the `test` job as an artifact
      # instead, and the `coverage` job is where the two are merged.
      #
      # `coverage:db` is this same lane plus a coverage report, not a second
      # run: the assertions and the advisory lock are identical.
      - name: Run the database-backed lane
        run: bun run coverage:db

      - name: Upload the database lane coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-coverage
          path: coverage/db/coverage-final.json
          if-no-files-found: error
          retention-days: 1

      # `schema.prisma` and the migration history describe the same schema. This
      # builds one from the migrations in a scratch database and fails when
      # Prisma would change anything to reach the schema, so the two cannot
      # drift apart silently.
      - name: Check the Prisma schema against the migration history
        run: bun run check:prisma-drift

  tenant-isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_LANE_ADMIN_URL: postgres://aihub:change-me@localhost:5432/aihub
      DB_LANE_DATABASE_NAME: aihub_tenant_isolation_lane
      TENANT_ISOLATION_REDIS_URL: redis://localhost:6379/15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: aihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub -d aihub && psql -U aihub -d aihub -q -v ON_ERROR_STOP=1 -c 'ALTER DATABASE aihub SET aihub.test_lane_marker TO aihub_db_lane_v1' >/dev/null"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli SET aihub:test-lane:owner aihub-db-lane-v1 >/dev/null && redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        run: npm install --global bun@1.4.4-canary.20261109.1

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enable bounded logical WAL for the tenant-isolation lane
        uses: ./.github/actions/enable-bounded-logical-wal

      - name: Run the cross-tenant isolation lane
        run: bun run coverage:tenant-isolation

      - name: Upload the tenant-isolation lane coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tenant-isolation-coverage
          path: coverage/tenant-isolation/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  # One coverage figure per pull request, merged across the lanes that test
  # `src`, and a failure when it falls past the agreed margin. Reading a single
  # lane's number answers a different question than the next: the database
  # repositories report 0% branches in the unit lane because only the database
  # lane runs them.
  coverage:
    name: Merged coverage
    if: ${{ !cancelled() }}
    needs:
      - test
      - database
      - tenant-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        run: npm install --global bun@1.4.4-canary.20261109.1

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the unit lane coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-coverage
          path: coverage/unit

      - name: Download the database lane coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: db-coverage
          path: coverage/db

      - name: Download the tenant-isolation lane coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tenant-isolation-coverage
          path: coverage/tenant-isolation

      # The margin and the reason for it live beside the constant in the script.
      # The baseline is committed, so a drop is measured against main rather
      # than against whatever the previous run produced. `pipefail` keeps the
      # gate's exit code through the pipe that publishes the report.
      - name: Report merged coverage and fail on a drop past the agreed margin
        run: |
          set -o pipefail
          bun run coverage:merged -- --check | tee -a "$GITHUB_STEP_SUMMARY"

  # The only job that runs the artifact CD deploys. The build lane builds `dist` with
  # the host's Node and the unit and database lanes each assemble a slice of
  # the application; none of them builds the image or boots the whole
  # dependency-injection graph under the image's own Node, entrypoint, and
  # secret loading. It then runs the database-backed N-1 release checks. Both
  # gates run before the image can be published for CD.
  #
  # The image artifact CD ships must be the artifact this lane started, not a
  # second build of the same Dockerfile. The push-only job publishes it after
  # this lane passes (ADR-0064).
  resolve-active-release:
    name: Resolve active release revisions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    permissions:
      contents: read
    outputs:
      production_sha: ${{ steps.revisions.outputs.production_sha }}
      sandbox_sha: ${{ steps.revisions.outputs.sandbox_sha }}
      sandbox_disabled: ${{ steps.revisions.outputs.sandbox_disabled }}
    steps:
      - name: Configure read-only host access
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$VPS_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$VPS_PORT >= 1 && 10#$VPS_PORT <= 65535 ))
          ssh_dir="$RUNNER_TEMP/aihub-ssh"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          {
            printf 'Host aihub-read-only\n'
            printf '  HostName %s\n' "$VPS_HOST"
            printf '  User %s\n' "$VPS_USER"
            printf '  Port %s\n' "$VPS_PORT"
            printf '  IdentityFile %s/key\n' "$ssh_dir"
            printf '  UserKnownHostsFile %s/known_hosts\n' "$ssh_dir"
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  ConnectTimeout 10\n'
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          printf 'AIHUB_SSH_CONFIG=%s\n' "$ssh_dir/config" >> "$GITHUB_ENV"

      - name: Read active tier revisions
        id: revisions
        shell: bash
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          test -n "$VPS_APP_DIR"
          printf -v app_dir_arg '%q' "$VPS_APP_DIR"
          state="$(ssh -F "$AIHUB_SSH_CONFIG" aihub-read-only "APP_DIR=$app_dir_arg bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          helper=./scripts/ops/blue-green/blue-green-host.sh
          if [[ ! -x "$helper" ]]; then
            helper=./scripts/ops/blue-green-host.sh
          fi
          "$helper" status
          REMOTE
          )"
          printf 'Active host state:\n%s\n' "$state"
          production_sha="$(sed -nE 's/^production active_slot=[ab] sha=([a-f0-9]{40}) service=.*/\1/p' <<< "$state")"
          [[ "$production_sha" =~ ^[a-f0-9]{40}$ ]] || {
            printf 'Production active revision is missing or unknown\n' >&2
            exit 1
          }
          sandbox_sha="$(sed -nE 's/^sandbox active_slot=[ab] sha=([a-f0-9]{40}) service=.*/\1/p' <<< "$state")"
          sandbox_disabled=false
          if [[ ! "$sandbox_sha" =~ ^[a-f0-9]{40}$ ]] && ! grep -Fxq 'sandbox disabled' <<< "$state"; then
            printf 'Sandbox active revision is missing or unknown\n' >&2
            exit 1
          elif [[ ! "$sandbox_sha" =~ ^[a-f0-9]{40}$ ]]; then
            sandbox_disabled=true
          fi
          printf 'production_sha=%s\nsandbox_sha=%s\nsandbox_disabled=%s\n' \
            "$production_sha" "$sandbox_sha" "$sandbox_disabled" >> "$GITHUB_OUTPUT"

  image:
    name: Image boot
    needs: resolve-active-release
    if: >-
      always() &&
      (github.event_name != 'push' || github.ref != 'refs/heads/main' ||
      needs.resolve-active-release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
    services:
      postgres:
        image: postgres:16.10-alpine
        command: >-
          postgres -c wal_level=logical -c max_replication_slots=10
          -c max_wal_senders=10 -c max_slot_wal_keep_size=512MB
        env:
          POSTGRES_DB: aihub
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aihub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only for the boot configuration script, which needs Node's built-ins
      # and no dependencies.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        run: npm install --global bun@1.4.4-canary.20261109.1

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies for the release compatibility gate
        run: bun install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate monitoring Compose, Prometheus, alert, and blackbox configs
        run: node scripts/ops/monitoring/check-monitoring-config.cjs

      - name: Check production container log bounds
        env:
          AIHUB_EMAIL_SEND_RATE_LIMIT: "1"
          AIHUB_EMAIL_SEND_RATE_DURATION_MS: "1000"
          AIHUB_EMAIL_DAILY_SEND_BUDGET: "80"
        run: |
          set -o pipefail
          docker compose --profile "*" --env-file .env.production.example -f docker-compose.production.yml config --format json \
            | node scripts/ci/compose/check-production-compose-logs.cjs

      - name: Validate production Compose defaults and trusted proxy
        env:
          AIHUB_EMAIL_SEND_RATE_LIMIT: "1"
          AIHUB_EMAIL_SEND_RATE_DURATION_MS: "1000"
          AIHUB_EMAIL_DAILY_SEND_BUDGET: "80"
          # Existing production env files may predate the optional pooler role ID.
          AIHUB_PGBOUNCER_VAULT_ROLE_ID_FILE: ""
        run: |
          set -o pipefail
          docker compose --profile "*" --env-file .env.production.example -f docker-compose.production.yml config --format json \
            | node scripts/ci/compose/check-trusted-proxy-compose.cjs

      # Built and loaded into this runner's daemon, not pushed: the boot check
      # below has to start the exact image, and buildx cannot both load an image
      # and emit the manifest list a push needs. The push is a separate step
      # once the boot has passed. The Dockerfile this uses is the only one
      # release ever builds (ADR-0064).
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: aihub:image-boot
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Baked into the image so `docker inspect` on the VPS can name the
          # commit that is live. The deployed checkout carries no `.git`, so
          # there is no other place to read it from.
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Check scheduled job paths in the shipped image
        run: node scripts/ci/image/host-job-image-check.cjs aihub:image-boot

      # ADR-0088: the generated client is Rust-free and the `prisma` CLI is a
      # devDependency, so neither it nor its engines may reach the runtime image.
      - name: Check the Prisma CLI is not in the shipped image
        run: >-
          docker run --rm --entrypoint sh aihub:image-boot -c
          'test ! -e node_modules/prisma && test ! -e node_modules/.bin/prisma'

      - name: Boot the image and wait for its health check
        run: bash scripts/ci/image/image-boot-check.sh aihub:image-boot

      # #331: scan the booted image and operational support images with Grype
      # before allowing the image to be published or deployed.
      - name: Install Grype 0.87.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/grype.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/anchore/grype/releases/download/v0.87.0/grype_0.87.0_linux_amd64.tar.gz
          printf '%s  %s\n' \
            'be710d15f5477e5c77ce03d14e480263415d7ab135e04b8483663f688823087d' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" grype
          "$RUNNER_TEMP/grype" version
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan booted production image for fixable CVEs (Grype)
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(docker image inspect --format '{{.Id}}' aihub:image-boot)"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "### Vulnerability scan: aihub:image-boot ($image_id)" >> "$GITHUB_STEP_SUMMARY"
          grype "docker:$image_id" --output table >> "$GITHUB_STEP_SUMMARY" || true
          grype "docker:$image_id" --only-fixed --fail-on high

      - name: Build and scan firewall guard image (Grype)
        shell: bash
        run: |
          set -euo pipefail
          docker build -t aihub-guard:scan -f ops/firewall/guard.Dockerfile scripts/ops/firewall
          image_id="$(docker image inspect --format '{{.Id}}' aihub-guard:scan)"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "### Vulnerability scan: ops/firewall/guard.Dockerfile ($image_id)" >> "$GITHUB_STEP_SUMMARY"
          grype "docker:$image_id" --output table >> "$GITHUB_STEP_SUMMARY" || true
          grype "docker:$image_id" --only-fixed --fail-on high

      - name: Build and scan monitoring SSH tunnel image (Grype)
        shell: bash
        run: |
          set -euo pipefail
          docker build -t aihub-ssh-tunnel:scan -f ops/monitoring/ssh-tunnel.Dockerfile ops/monitoring
          image_id="$(docker image inspect --format '{{.Id}}' aihub-ssh-tunnel:scan)"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "### Vulnerability scan: ops/monitoring/ssh-tunnel.Dockerfile ($image_id)" >> "$GITHUB_STEP_SUMMARY"
          grype "docker:$image_id" --output table >> "$GITHUB_STEP_SUMMARY" || true
          grype "docker:$image_id" --only-fixed --fail-on high

      - name: Select active per-tier release revisions
        id: previous_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVE_PRODUCTION_SHA: ${{ needs.resolve-active-release.outputs.production_sha }}
          ACTIVE_SANDBOX_SHA: ${{ needs.resolve-active-release.outputs.sandbox_sha }}
          ACTIVE_SANDBOX_DISABLED: ${{ needs.resolve-active-release.outputs.sandbox_disabled }}
        run: node --import tsx scripts/ci/n-minus-one/previous-deployed-release.ts

      - name: Recover active-tier image digests
        id: previous_digests
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_DIGEST_RUN_ID: ${{ steps.previous_release.outputs.previous_digest_run_id }}
          SANDBOX_DIGEST_RUN_ID: ${{ steps.previous_release.outputs.sandbox_digest_run_id }}
        run: |
          set -euo pipefail
          mkdir -p temp/n-minus-one/previous-production
          gh run download "$PREVIOUS_DIGEST_RUN_ID" --name image-digest --dir temp/n-minus-one/previous-production
          production_digest="$(tr -d '\r\n' < temp/n-minus-one/previous-production/image-digest.txt)"
          [[ "$production_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          sandbox_digest=''
          if [[ -n "$SANDBOX_DIGEST_RUN_ID" ]]; then
            mkdir -p temp/n-minus-one/previous-sandbox
            gh run download "$SANDBOX_DIGEST_RUN_ID" --name image-digest --dir temp/n-minus-one/previous-sandbox
            sandbox_digest="$(tr -d '\r\n' < temp/n-minus-one/previous-sandbox/image-digest.txt)"
            [[ "$sandbox_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          fi
          printf 'production_digest=%s\nsandbox_digest=%s\n' \
            "$production_digest" "$sandbox_digest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for the previous Production image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull the previous Production image
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.previous_release.outputs.previous_sha }}
          SANDBOX_SHA: ${{ steps.previous_release.outputs.sandbox_sha }}
          PREVIOUS_DIGEST: ${{ steps.previous_digests.outputs.production_digest }}
          SANDBOX_DIGEST: ${{ steps.previous_digests.outputs.sandbox_digest }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io' EXIT
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if production_tag_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image:$PREVIOUS_SHA" 2>/dev/null)"; then
            test "$production_tag_digest" = "$PREVIOUS_DIGEST"
          fi
          docker pull "$image@$PREVIOUS_DIGEST"
          if [[ -n "$SANDBOX_SHA" ]]; then
            if sandbox_tag_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image:$SANDBOX_SHA" 2>/dev/null)"; then
              test "$sandbox_tag_digest" = "$SANDBOX_DIGEST"
            fi
            docker pull "$image@$SANDBOX_DIGEST"
          fi

      - name: Create the local Resend TLS fixture
        run: |
          set -euo pipefail
          mkdir -p temp/n-minus-one
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout temp/n-minus-one/resend.key \
            -out temp/n-minus-one/resend.crt \
            -subj '/CN=api.resend.com' \
            -addext 'subjectAltName=DNS:api.resend.com'

      - name: Verify N-1 reads candidate writes and shares Redis state
        env:
          CANDIDATE_IMAGE: aihub:image-boot
          CANDIDATE_SHA: ${{ github.sha }}
          PREVIOUS_IMAGE: ghcr.io/aihub-ecosystem/aihub-be@${{ steps.previous_digests.outputs.production_digest }}
          PREVIOUS_SHA: ${{ steps.previous_release.outputs.previous_sha }}
          PREVIOUS_DIGEST: ${{ steps.previous_digests.outputs.production_digest }}
          PREVIOUS_TIER: Production
          AIHUB_EMAIL_VERIFICATION_REQUIRES_PASSWORD: ${{ vars.AIHUB_EMAIL_VERIFICATION_REQUIRES_PASSWORD || 'false' }}
        run: bun run ci:check-n-minus-one

      - name: Reset isolated N-1 fixtures before the Sandbox predecessor check
        if: ${{ steps.previous_release.outputs.sandbox_sha != '' && (steps.previous_release.outputs.sandbox_sha != steps.previous_release.outputs.previous_sha || steps.previous_digests.outputs.sandbox_digest != steps.previous_digests.outputs.production_digest) }}
        run: node --import tsx scripts/ci/n-minus-one/reset-n-minus-one-state.ts

      - name: Verify N-1 reads candidate writes against the active Sandbox image
        if: ${{ steps.previous_release.outputs.sandbox_sha != '' && (steps.previous_release.outputs.sandbox_sha != steps.previous_release.outputs.previous_sha || steps.previous_digests.outputs.sandbox_digest != steps.previous_digests.outputs.production_digest) }}
        env:
          CANDIDATE_IMAGE: aihub:image-boot
          CANDIDATE_SHA: ${{ github.sha }}
          PREVIOUS_IMAGE: ghcr.io/aihub-ecosystem/aihub-be@${{ steps.previous_digests.outputs.sandbox_digest }}
          PREVIOUS_SHA: ${{ steps.previous_release.outputs.sandbox_sha }}
          PREVIOUS_DIGEST: ${{ steps.previous_digests.outputs.sandbox_digest }}
          PREVIOUS_TIER: Sandbox
          AIHUB_EMAIL_VERIFICATION_REQUIRES_PASSWORD: ${{ vars.AIHUB_EMAIL_VERIFICATION_REQUIRES_PASSWORD || 'false' }}
        run: bun run ci:check-n-minus-one

      - name: Record the tested predecessor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PREVIOUS_SHA: ${{ steps.previous_release.outputs.previous_sha }}
          SANDBOX_SHA: ${{ steps.previous_release.outputs.sandbox_sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PREVIOUS_SHA" > previous-release.txt
          if [[ -n "$SANDBOX_SHA" && "$SANDBOX_SHA" != "$PREVIOUS_SHA" ]]; then
            printf '%s\n' "$SANDBOX_SHA" >> previous-release.txt
          fi

      - name: Upload the tested predecessor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previous-release
          path: previous-release.txt

      # Only the push-only job needs this archive. Pull requests build and boot
      # without entering production or receiving its secrets.
      - name: Save booted image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output image-to-publish.tar aihub:image-boot

      - name: Upload booted image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-to-publish
          path: image-to-publish.tar
          compression-level: 0

  # This is the only CI job that publishes a release image to GHCR. The branch
  # allowlist is configured on the environment, and this job only exists for main pushes.
  publish-image:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download booted image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-to-publish

      - name: Load booted image
        run: docker load --input image-to-publish.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GITHUB_TOKEN cannot write this organization package until its package
      # setting is enabled, so keep the existing write-capable token here.
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      # The registry manifest digest is not the local image ID. Read it the
      # same way CD does instead of scraping docker push's per-layer output.
      - name: Push the image that booted
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_repo="ghcr.io/${REPOSITORY,,}"
          image="${image_repo}:${SHA}"
          docker tag aihub:image-boot "$image"
          docker push "$image"
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image")"
          test -n "$digest"
          image_ref="${image_repo}@${digest}"
          printf '%s\n' "$digest" > image-digest.txt
          printf 'IMAGE_REPO=%s\n' "$image_repo" >> "$GITHUB_ENV"
          printf 'IMAGE_REF=%s\n' "$image_ref" >> "$GITHUB_ENV"
          printf 'IMAGE_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"
          printf '### Image published\n\n`%s`\n\nManifest digest `%s`\n\nSBOM provenance: attached as signed SPDX in-toto attestation to `%s`.\n' \
            "$image" "$digest" "$image_ref" >> "$GITHUB_STEP_SUMMARY"

      # Syft SPDX for the pushed digest — bound to the digest, not the tag,
      # so the "which image contains CVE X" question (#1814) has one answer.
      # Pinned by SHA256 per repo selected-actions policy.
      - name: Install Syft 1.18.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/anchore/syft/releases/download/v1.18.1/syft_1.18.1_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '066c251652221e4d44fcc4d115ce3df33a91769da38c830a8533199db2f65aab' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" syft
          "$RUNNER_TEMP/syft" version
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Generate SBOM for the pushed image digest
        id: sbom
        shell: bash
        run: |
          set -euo pipefail
          syft "$IMAGE_REF" -o spdx-json=image-sbom.spdx.json
          test -s image-sbom.spdx.json

      # cosign keyless signing: image signature + SPDX attestation, both bound
      # to the pushed digest, plus an offline detached bundle for non-registry verification.
      - name: Install Cosign 2.4.1
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/cosign"
          curl --fail --silent --show-error --location \
            --output "$binary" \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          printf '%s  %s\n' \
            '8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b' \
            "$binary" | sha256sum --check
          chmod +x "$binary"
          "$binary" version
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sign the image and attach the SBOM attestation
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          test -s image-sbom.spdx.json
          docker login ghcr.io --username "$GHCR_USERNAME" --password "$GHCR_PULL_TOKEN" || true
          cosign sign --yes \
            -a "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -a "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -a "sbom.spdx.location=${IMAGE_REF}" \
            "$IMAGE_REF"
          cosign attest --yes \
            --type spdxjson \
            --predicate image-sbom.spdx.json \
            "$IMAGE_REF"
          cosign sign-blob --yes \
            --bundle image-sbom.spdx.json.bundle \
            image-sbom.spdx.json
          printf 'SBOM attestation and offline bundle signed for `%s` (SPDX JSON, keyless cosign).\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the signed SBOM and bundle
        if: always() && steps.sbom.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: |
            image-sbom.spdx.json
            image-sbom.spdx.json.bundle

      # Native Grype scan of the attached SBOM. Fails the release if a vulnerability
      # at or above high is found (threshold recorded in docs/operations/image-sbom-provenance.md).
      # The SBOM attestation is already in the registry above so findings are inspectable.
      - name: Install Grype 0.87.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/grype.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/anchore/grype/releases/download/v0.87.0/grype_0.87.0_linux_amd64.tar.gz
          printf '%s  %s\n' \
            'be710d15f5477e5c77ce03d14e480263415d7ab135e04b8483663f688823087d' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" grype
          "$RUNNER_TEMP/grype" version
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan SBOM for vulnerabilities (Grype)
        shell: bash
        run: |
          set -euo pipefail
          grype sbom:image-sbom.spdx.json --only-fixed --fail-on high

      # `workflow_run` payloads carry no job outputs, so this artifact is how
      # the digest reaches CD. It exists only when publishing succeeds.
      - name: Record the published digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: image-digest.txt

  outbox-evaluation:
    name: Zero-table Outbox Evaluation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_outbox_evaluation }}
    uses: ./.github/workflows/zero-table-outbox-evaluation.yml

  # The artifact CD deploys has to be published as well as booted before CI is
  # green. The publisher is intentionally skipped for PRs and manual runs.

  ci:
    name: CI
    if: ${{ always() }}
    needs:
      - secret-scan
      - static
      - test
      - shell-specs
      - dev-restart-budget
      - build
      - audit
      - customer-web-contract
      - database
      - tenant-isolation
      - coverage
      - image
      - publish-image
      - outbox-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require all lanes
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SHELL_SPECS_RESULT: ${{ needs.shell-specs.result }}
          DEV_RESTART_BUDGET_RESULT: ${{ needs.dev-restart-budget.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          CUSTOMER_WEB_CONTRACT_RESULT: ${{ needs.customer-web-contract.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          TENANT_ISOLATION_RESULT: ${{ needs.tenant-isolation.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PUBLISH_IMAGE_RESULT: ${{ needs.publish-image.result }}
          OUTBOX_EVALUATION_RESULT: ${{ needs.outbox-evaluation.result }}
          RUN_OUTBOX_EVALUATION: ${{ inputs.run_outbox_evaluation }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          test "$SECRET_SCAN_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$SHELL_SPECS_RESULT" = success
          test "$DEV_RESTART_BUDGET_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$AUDIT_RESULT" = success
          test "$CUSTOMER_WEB_CONTRACT_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$TENANT_ISOLATION_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$IMAGE_RESULT" = success
          if [ "$EVENT_NAME" = push ] && [ "$REF" = refs/heads/main ]; then
            test "$PUBLISH_IMAGE_RESULT" = success
          else
            test "$PUBLISH_IMAGE_RESULT" = skipped
          fi
          if [ "$RUN_OUTBOX_EVALUATION" = true ]; then
            test "$OUTBOX_EVALUATION_RESULT" = success
          else
            test "$OUTBOX_EVALUATION_RESULT" = skipped
          fi
