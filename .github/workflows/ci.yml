name: CI

on:
  # Deliberately unfiltered: a pull request always reports a check, whatever it
  # touches. Filtering here would skip the workflow instead of passing it, and
  # a required check that never runs blocks the pull request forever.
  pull_request:
    branches: [main]

  # Filtered, because CD triggers on this workflow completing and would
  # otherwise rebuild and redeploy production for a change that cannot reach
  # the image. These paths are the ones `.dockerignore` already excludes, plus
  # git's own checkout configuration. A push that touches any other path still
  # runs: `paths-ignore` skips only when every changed file matches.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".gitattributes"
      - ".gitignore"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm verify

      - name: Build application
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  database:
    name: Database lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: aihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub -d aihub"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs apart from `pnpm verify`: the default lane must keep passing with
      # no database present, and this one proves the SQL those tests can only
      # describe.
      # No DB_LANE_ADMIN_URL: the service credentials above deliberately match
      # the lane's default in test/db/database.ts, so CI exercises the same path
      # a developer does and a broken default fails here too.
      - name: Run the database-backed lane
        run: pnpm test:db
