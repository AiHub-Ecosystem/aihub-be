name: CI

on:
  # Deliberately unfiltered: a pull request always reports a check, whatever it
  # touches. Filtering here would skip the workflow instead of passing it, and
  # a required check that never runs blocks the pull request forever.
  pull_request:
    branches: [main]

  # Markdown is skipped unless a tracked spec reads it. The CI path-filter
  # spec compares this allowlist with Markdown paths found in test sources.
  push:
    branches: [main]
    paths:
      - "**"
      - "!.claude/**"
      - "!.gitattributes"
      - "!.gitignore"
      - "!*.md"
      - "!**/*.md"
      - "docs/adr/0060-writing-task1-sample-image-is-published-not-signed.md"
      - "docs/history/aihub-deliverable-1-historical-contract.md"
      - "docs/integration-guide.md"
      - "docs/local-demo.md"
      - "docs/operations/deploy-vps.md"
      - "ops/vault/README.md"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check unused exports
        run: pnpm knip

      - name: Lint source
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm type-check

      - name: Check migrations
        run: pnpm check:migrations

      - name: Check architecture
        run: pnpm arch-check

      - name: Check import style
        run: pnpm check:imports

      - name: Validate OpenAPI
        run: pnpm validate:openapi

      - name: Install nginx for the edge compression check
        run: sudo apt-get update && sudo apt-get install --yes nginx logrotate

      - name: Verify scoped Speaking JSON gzip
        run: bash ops/nginx/check-gzip.sh

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The unit lane reports coverage as well as asserting: it is the only job
      # that runs where no Redis or Postgres answers, which is what the lane's
      # contract is, and the `coverage` job merges this report with the database
      # lane's to judge one figure.
      - name: Run unit tests
        run: pnpm coverage:unit

      - name: Upload the unit lane coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: coverage/unit/coverage-final.json
          if-no-files-found: error
          # Consumed by the `coverage` job in this same run and never after.
          retention-days: 1

      - name: Test monitoring config checker
        run: pnpm test:monitoring-config

      - name: Test the changed-file gate map
        run: pnpm test:check-changed

      - name: Exercise scheduled host job wrappers with stubs
        run: bash scripts/ops/host-jobs/host-scheduled-job.spec.sh

      - name: Exercise the Postgres backup job with stubs
        run: bash scripts/ops/backups/backup-postgres.spec.sh

      - name: Exercise request log lookup with fixtures and stubs
        run: bash test/cli/request-log-lookup.spec.sh

      - name: Exercise nginx upstream selection for port and socket slots
        run: bash test/ops/blue-green-upstream.spec.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Check build output imports
        run: pnpm check:imports:dist

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  database:
    name: Database lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDIS_URL: redis://localhost:6379/14

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: aihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub -d aihub && psql -U aihub -d aihub -q -v ON_ERROR_STOP=1 -c 'ALTER DATABASE aihub SET aihub.test_lane_marker TO aihub_db_lane_v1' >/dev/null"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli SET aihub:test-lane:owner aihub-db-lane-v1 >/dev/null && redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The operator CLI smoke test spawns `scripts/cli/cli.mjs`, which loads its
      # API-key generator and command runners from the build.
      - name: Build application
        run: pnpm build

      # Runs apart from `pnpm verify`: the default lane must keep passing with
      # no database present, and this one proves the SQL those tests can only
      # describe.
      # No DB_LANE_ADMIN_URL: the service credentials above deliberately match
      # the lane's default in test/db/shared/database.ts, so CI exercises the same path
      # a developer does and a broken default fails here too.
      #
      # This lane is deliberately NOT also asked to run the unit suite: it sets
      # REDIS_URL, so running the unit suite here left the lane's rate limiter
      # counters in Redis and that suite answered 429 where it expected 200.
      # The unit lane's report travels from the `test` job as an artifact
      # instead, and the `coverage` job is where the two are merged.
      #
      # `coverage:db` is this same lane plus a coverage report, not a second
      # run: the assertions and the advisory lock are identical.
      - name: Run the database-backed lane
        run: pnpm coverage:db

      - name: Upload the database lane coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-coverage
          path: coverage/db/coverage-final.json
          if-no-files-found: error
          retention-days: 1

      # `schema.prisma` and the migration history describe the same schema. This
      # builds one from the migrations in a scratch database and fails when
      # Prisma would change anything to reach the schema, so the two cannot
      # drift apart silently.
      - name: Check the Prisma schema against the migration history
        run: pnpm check:prisma-drift

  tenant-isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_LANE_ADMIN_URL: postgres://aihub:change-me@localhost:5432/aihub
      DB_LANE_DATABASE_NAME: aihub_tenant_isolation_lane
      TENANT_ISOLATION_REDIS_URL: redis://localhost:6379/15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: aihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub -d aihub && psql -U aihub -d aihub -q -v ON_ERROR_STOP=1 -c 'ALTER DATABASE aihub SET aihub.test_lane_marker TO aihub_db_lane_v1' >/dev/null"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli SET aihub:test-lane:owner aihub-db-lane-v1 >/dev/null && redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the cross-tenant isolation lane
        run: pnpm test:tenant-isolation

  # One coverage figure per pull request, merged across the lanes that test
  # `src`, and a failure when it falls past the agreed margin. Reading a single
  # lane's number answers a different question than the next: the database
  # repositories report 0% branches in the unit lane because only the database
  # lane runs them.
  coverage:
    name: Merged coverage
    needs:
      - test
      - database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the unit lane coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-coverage
          path: coverage/unit

      - name: Download the database lane coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: db-coverage
          path: coverage/db

      # The margin and the reason for it live beside the constant in the script.
      # The baseline is committed, so a drop is measured against main rather
      # than against whatever the previous run produced. `pipefail` keeps the
      # gate's exit code through the pipe that publishes the report.
      - name: Report merged coverage and fail on a drop past the agreed margin
        run: |
          set -o pipefail
          pnpm coverage:merged -- --check | tee -a "$GITHUB_STEP_SUMMARY"

  # The only job that runs the artifact CD deploys. The build lane builds `dist` with
  # the host's Node and the unit and database lanes each assemble a slice of
  # the application; none of them builds the image or boots the whole
  # dependency-injection graph under the image's own Node, entrypoint, and
  # secret loading. This does, with throwaway configuration and no database,
  # and fails before CD can ship a release that cannot start. It proves the
  # image builds and starts, nothing more: docs/operations/ci-boot-check.md.
  #
  # The image artifact CD ships must be the artifact this lane started, not a
  # second build of the same Dockerfile. The push-only job publishes it after
  # this lane passes (ADR-0064).
  image:
    name: Image boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only for the boot configuration script, which needs Node's built-ins
      # and no dependencies.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate monitoring Compose, Prometheus, alert, and blackbox configs
        run: node scripts/ops/monitoring/check-monitoring-config.cjs

      - name: Check production container log bounds
        run: |
          set -o pipefail
          docker compose --profile "*" --env-file .env.production.example -f docker-compose.production.yml config --format json \
            | node scripts/ci/check-production-compose-logs.cjs

      - name: Check trusted proxy matches the pinned backend gateway
        run: |
          set -o pipefail
          docker compose --profile "*" --env-file .env.production.example -f docker-compose.production.yml config --format json \
            | node scripts/ci/check-trusted-proxy-compose.cjs

      # Built and loaded into this runner's daemon, not pushed: the boot check
      # below has to start the exact image, and buildx cannot both load an image
      # and emit the manifest list a push needs. The push is a separate step
      # once the boot has passed. The Dockerfile this uses is the only one
      # release ever builds (ADR-0064).
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: aihub:image-boot
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Baked into the image so `docker inspect` on the VPS can name the
          # commit that is live. The deployed checkout carries no `.git`, so
          # there is no other place to read it from.
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Check scheduled job paths in the shipped image
        run: node scripts/ci/host-job-image-check.cjs aihub:image-boot

      - name: Boot the image and wait for its health check
        run: bash scripts/ci/image-boot-check.sh aihub:image-boot

      # Only the push-only job needs this archive. Pull requests build and boot
      # without entering production or receiving its secrets.
      - name: Save booted image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output image-to-publish.tar aihub:image-boot

      - name: Upload booted image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-to-publish
          path: image-to-publish.tar
          compression-level: 0

  # This is the only CI job that enters production. The branch allowlist is
  # configured on the environment, and this job only exists for main pushes.
  publish-image:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download booted image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-to-publish

      - name: Load booted image
        run: docker load --input image-to-publish.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GITHUB_TOKEN cannot write this organization package until its package
      # setting is enabled, so keep the existing write-capable token here.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      # The registry manifest digest is not the local image ID. Read it the
      # same way CD does instead of scraping docker push's per-layer output.
      - name: Push the image that booted
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}:${SHA}"
          docker tag aihub:image-boot "$image"
          docker push "$image"
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image")"
          test -n "$digest"
          printf '%s\n' "$digest" > image-digest.txt
          printf '### Image published\n\n`%s`\n\nManifest digest `%s`\n' \
            "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"

      # `workflow_run` payloads carry no job outputs, so this artifact is how
      # the digest reaches CD. It exists only when publishing succeeds.
      - name: Record the published digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: image-digest.txt

  # The artifact CD deploys has to be published as well as booted before CI is
  # green. The publisher is intentionally skipped for PRs and manual runs.

  ci:
    name: CI
    if: ${{ always() }}
    needs:
      - static
      - test
      - build
      - audit
      - database
      - tenant-isolation
      - coverage
      - image
      - publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require all lanes
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          TENANT_ISOLATION_RESULT: ${{ needs.tenant-isolation.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PUBLISH_IMAGE_RESULT: ${{ needs.publish-image.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$AUDIT_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$TENANT_ISOLATION_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$IMAGE_RESULT" = success
          if [ "$EVENT_NAME" = push ] && [ "$REF" = refs/heads/main ]; then
            test "$PUBLISH_IMAGE_RESULT" = success
          else
            test "$PUBLISH_IMAGE_RESULT" = skipped
          fi
