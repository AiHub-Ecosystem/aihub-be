name: CI

on:
  # Deliberately unfiltered: a pull request always reports a check, whatever it
  # touches. Filtering here would skip the workflow instead of passing it, and
  # a required check that never runs blocks the pull request forever.
  pull_request:
    branches: [main]

  # Filtered, because CD triggers on this workflow completing and would
  # otherwise rebuild and redeploy production for a change that cannot reach
  # the image. These paths are the ones `.dockerignore` already excludes, plus
  # git's own checkout configuration. A push that touches any other path still
  # runs: `paths-ignore` skips only when every changed file matches.
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - ".gitattributes"
      - ".gitignore"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check unused exports
        run: pnpm knip

      - name: Lint source
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm type-check

      - name: Check migrations
        run: pnpm check:migrations

      - name: Check architecture
        run: pnpm arch-check

      - name: Check import style
        run: pnpm check:imports

      - name: Validate OpenAPI
        run: pnpm validate:openapi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Check build output imports
        run: pnpm check:imports:dist

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  database:
    name: Database lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDIS_URL: redis://localhost:6379/14

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: aihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub -d aihub"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs apart from `pnpm verify`: the default lane must keep passing with
      # no database present, and this one proves the SQL those tests can only
      # describe.
      # No DB_LANE_ADMIN_URL: the service credentials above deliberately match
      # the lane's default in test/db/database.ts, so CI exercises the same path
      # a developer does and a broken default fails here too.
      - name: Run the database-backed lane
        run: pnpm test:db

  tenant-isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_LANE_ADMIN_URL: postgres://aihub:change-me@localhost:5432/aihub
      DB_LANE_DATABASE_NAME: aihub_tenant_isolation_lane
      TENANT_ISOLATION_REDIS_URL: redis://localhost:6379/15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: aihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub -d aihub"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the cross-tenant isolation lane
        run: pnpm test:tenant-isolation

  # The only job that runs the artifact CD deploys. The build lane builds `dist` with
  # the host's Node and the unit and database lanes each assemble a slice of
  # the application; none of them builds the image or boots the whole
  # dependency-injection graph under the image's own Node, entrypoint, and
  # secret loading. This does, with throwaway configuration and no database,
  # and fails before CD can ship a release that cannot start. It proves the
  # image builds and starts, nothing more: docs/operations/ci-boot-check.md.
  #
  # It also publishes that image, so the artifact CD ships is the artifact this
  # lane started rather than a second build of the same Dockerfile. CD pulls by
  # commit sha and checks the digest against the one this lane records
  # (ADR-0064).
  image:
    name: Image boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment is here for its registry credential, not for protection:
    # it declares no reviewers and no branch policy, so entering it gates
    # nothing. See the push step for why GITHUB_TOKEN cannot do this job.
    environment:
      name: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Only for the boot configuration script, which needs Node's built-ins
      # and no dependencies.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Built and loaded into this runner's daemon, not pushed: the boot check
      # below has to start the exact image, and buildx cannot both load an image
      # and emit the manifest list a push needs. The push is a separate step
      # once the boot has passed. The Dockerfile this uses is the only one
      # release ever builds (ADR-0064).
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: aihub:image-boot
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Baked into the image so `docker inspect` on the VPS can name the
          # commit that is live. The deployed checkout carries no `.git`, so
          # there is no other place to read it from.
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Boot the image and wait for its health check
        run: bash scripts/image-boot-check.sh aihub:image-boot

      # Release images exist on the registry from here on. A pull request runs
      # the same build and boot check but pushes nothing, because no sha it
      # could tag is ever deployed.
      #
      # GITHUB_TOKEN is not the credential here. The package belongs to the
      # organization, and the workflow token can only write to it once
      # "Allow GitHub Actions to create and update packages" is enabled in the
      # package settings, which it is not; a first push failed with
      # `denied: permission_denied: write_package`. The registry token CD
      # already uses is named for reading, but it is the credential that can
      # write here: it carries write:packages and needs no such setting. Rename
      # it when it is next rotated.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      # The digest `docker push` reports is the manifest digest of what the
      # registry now holds, which is not the image ID `docker inspect` reports
      # for the local copy. Asked of the registry rather than scraped out of
      # `docker push` output, which interleaves a digest per layer, and read the
      # same way CD reads it.
      - name: Push the image that booted
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}:${SHA}"
          docker tag aihub:image-boot "$image"
          docker push "$image"
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image")"
          test -n "$digest"
          printf '%s\n' "$digest" > image-digest.txt
          printf '### Image published\n\n`%s`\n\nManifest digest `%s`\n' \
            "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"

      # `workflow_run` payloads carry no job outputs, so this artifact is how
      # the digest reaches CD. It exists only when the push did: CD runs only
      # when every lane passed, and a failed push fails this lane.
      - name: Record the published digest
        if: hashFiles('image-digest.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: image-digest
          path: image-digest.txt

  ci:
    name: CI
    if: ${{ always() }}
    needs:
      - static
      - test
      - build
      - audit
      - database
      - tenant-isolation
      - image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require all lanes
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          TENANT_ISOLATION_RESULT: ${{ needs.tenant-isolation.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$AUDIT_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$TENANT_ISOLATION_RESULT" = success
          test "$IMAGE_RESULT" = success
