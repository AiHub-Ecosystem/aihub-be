name: Flaky test PR report

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  report:
    if: ${{ github.event.workflow_run.pull_requests[0].number }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      # Keep the write token out of the workflow job that executes PR test code.
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download flaky-test metrics from the completed CI run
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flaky-test-history
          run-id: ${{ github.event.workflow_run.id }}
          path: temp/flaky-test-report
          github-token: ${{ github.token }}

      - name: Update the pull request report
        env:
          AIHUB_FLAKY_PR_NUMBERS: ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/flaky-tests/post-pr-comment.mjs
