name: CodeRabbit review opt-in

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

concurrency:
  group: coderabbit-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    permissions:
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Add the CodeRabbit opt-in label for non-members
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const shouldRequestCodeRabbitReview = (association) =>
              !['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association);

            const pullRequest = context.payload.pull_request;
            if (!shouldRequestCodeRabbitReview(pullRequest.author_association)) return;

            const label = {
              name: 'coderabbit-review',
              color: '7057ff',
              description: 'Request a CodeRabbit review for an external pull request.',
            };
            const labelOptions = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label.name,
            };

            try {
              await github.rest.issues.getLabel(labelOptions);
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
                await github.rest.issues.getLabel(labelOptions);
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              labels: [label.name],
            });
