# The ecosystem is `bun`, matching the `packageManager` field in package.json
# and the text `bun.lock`. Naming it here also replaces Dependabot's implicit
# security-update target, which reports `npm_and_yarn` and fails against a
# lockfile it does not own.
#
# Dependabot reads package.json and bun.lock. The `overrides` block in
# package.json keeps its ranged selectors, which Dependabot does not evaluate, so
# a bump it proposes can contradict an override the repo relies on. CI is the
# gate that decides, not this file.
version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    # Weekly rather than daily: this repo has a long test suite, and a noisy
    # open-pull-request-limit turns dependabot into a source of unreviewed churn.
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # OpenTelemetry packages version in lockstep: the SDK, core, resources,
      # sdk-trace, and the 0.x exporter and instrumentation packages must come
      # from one generation. A 0.x "minor" such as 0.223 to 0.300 is a generation
      # change, and mixed into the group below it left half the packages on the
      # old SDK (PR #1287). Listed first so it claims these packages before
      # minor-and-patch does; its majors arrive together as one PR to migrate.
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      # Minor and patch bumps share one PR: they rarely break anything, and one
      # PR beats a dozen single-bump PRs that each fail CI on their own.
      #
      # Major bumps are deliberately left out of the group. Folded into it, one
      # major that needs a migration turns the whole PR red and hides the rest
      # (PR #218 bundled ten majors and failed at install, lint, type-check, and
      # test, each for a different reason). Ungrouped, each major arrives as its
      # own PR that can be reviewed, migrated, and merged or closed alone.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors that need a migration of this repository's own tooling first.
      # Each one is ignored only for major versions, so minor and patch fixes
      # still flow through the group above. Remove an entry once its migration
      # is done, then let Dependabot propose the major on its own.
      #
      # typescript 7 drops the compiler API that scripts/checks/check-import-style.ts
      # reads; jest 30 and biome 2 change their configuration formats; and
      # @types/node must follow the Node major the image actually runs.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@biomejs/biome"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Workflow actions are pinned to commit SHAs (scripts/ci/action-pins.spec.ts),
  # so this is what keeps those SHAs current: each bump arrives as a pull
  # request that rewrites the SHA and its version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
