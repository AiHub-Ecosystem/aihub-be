# Temporary Stage A override. Remove this file from the deploy command after
# the production Vault cutover tracked by issue #30.
services:
  vault-agent:
    profiles:
      - vault

  migrate:
    environment:
      AIHUB_RUNTIME_SECRET_SOURCE: env
      AIHUB_RUNTIME_SECRETS_FILE: !reset null
      AIHUB_ALLOW_PRODUCTION_ENV_SECRETS: ${AIHUB_ALLOW_PRODUCTION_ENV_SECRETS:?AIHUB_ALLOW_PRODUCTION_ENV_SECRETS is required}
      DOWNSTREAM_AI_SPEAKING_CLIENT_ID: ${DOWNSTREAM_AI_SPEAKING_CLIENT_ID:?DOWNSTREAM_AI_SPEAKING_CLIENT_ID is required}
      DOWNSTREAM_AI_SPEAKING_SECRET_KEY: ${DOWNSTREAM_AI_SPEAKING_SECRET_KEY:?DOWNSTREAM_AI_SPEAKING_SECRET_KEY is required}
      DOWNSTREAM_AI_WRITING_TOKEN: ${DOWNSTREAM_AI_WRITING_TOKEN:?DOWNSTREAM_AI_WRITING_TOKEN is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      SEAWEEDFS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-}
      SEAWEEDFS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-}
    depends_on: !reset []
    volumes: !reset []

  migrate-sandbox:
    environment:
      AIHUB_RUNTIME_SECRET_SOURCE: env
      AIHUB_RUNTIME_SECRETS_FILE: !reset null
      AIHUB_ALLOW_PRODUCTION_ENV_SECRETS: ${AIHUB_ALLOW_PRODUCTION_ENV_SECRETS:?AIHUB_ALLOW_PRODUCTION_ENV_SECRETS is required}
      DOWNSTREAM_AI_SPEAKING_CLIENT_ID: ${DOWNSTREAM_AI_SPEAKING_CLIENT_ID:?DOWNSTREAM_AI_SPEAKING_CLIENT_ID is required}
      DOWNSTREAM_AI_SPEAKING_SECRET_KEY: ${DOWNSTREAM_AI_SPEAKING_SECRET_KEY:?DOWNSTREAM_AI_SPEAKING_SECRET_KEY is required}
      DOWNSTREAM_AI_WRITING_TOKEN: ${DOWNSTREAM_AI_WRITING_TOKEN:?DOWNSTREAM_AI_WRITING_TOKEN is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      SEAWEEDFS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-}
      SEAWEEDFS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-}
    depends_on: !reset []
    volumes: !reset []

  app:
    environment:
      AIHUB_RUNTIME_SECRET_SOURCE: env
      AIHUB_RUNTIME_SECRETS_FILE: !reset null
      AIHUB_ALLOW_PRODUCTION_ENV_SECRETS: ${AIHUB_ALLOW_PRODUCTION_ENV_SECRETS:?AIHUB_ALLOW_PRODUCTION_ENV_SECRETS is required}
      DOWNSTREAM_AI_SPEAKING_CLIENT_ID: ${DOWNSTREAM_AI_SPEAKING_CLIENT_ID:?DOWNSTREAM_AI_SPEAKING_CLIENT_ID is required}
      DOWNSTREAM_AI_SPEAKING_SECRET_KEY: ${DOWNSTREAM_AI_SPEAKING_SECRET_KEY:?DOWNSTREAM_AI_SPEAKING_SECRET_KEY is required}
      DOWNSTREAM_AI_WRITING_TOKEN: ${DOWNSTREAM_AI_WRITING_TOKEN:?DOWNSTREAM_AI_WRITING_TOKEN is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      SEAWEEDFS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-}
      SEAWEEDFS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-}
    depends_on: !reset []
    volumes: !reset []

  app-sandbox:
    environment:
      AIHUB_RUNTIME_SECRET_SOURCE: env
      AIHUB_RUNTIME_SECRETS_FILE: !reset null
      AIHUB_ALLOW_PRODUCTION_ENV_SECRETS: ${AIHUB_ALLOW_PRODUCTION_ENV_SECRETS:?AIHUB_ALLOW_PRODUCTION_ENV_SECRETS is required}
      DOWNSTREAM_AI_SPEAKING_CLIENT_ID: ${DOWNSTREAM_AI_SPEAKING_CLIENT_ID:?DOWNSTREAM_AI_SPEAKING_CLIENT_ID is required}
      DOWNSTREAM_AI_SPEAKING_SECRET_KEY: ${DOWNSTREAM_AI_SPEAKING_SECRET_KEY:?DOWNSTREAM_AI_SPEAKING_SECRET_KEY is required}
      DOWNSTREAM_AI_WRITING_TOKEN: ${DOWNSTREAM_AI_WRITING_TOKEN:?DOWNSTREAM_AI_WRITING_TOKEN is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      SEAWEEDFS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-}
      SEAWEEDFS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-}
    depends_on: !reset []
    volumes: !reset []
