[[rules.allowlists]]
description = "Only the two Postman variable-name false positives in their introduction commit are allowlisted; later changes to these files stay detectable."
condition = "AND"
commits = ["c35215e3aca9e55d3e29ff3de3af63a094a65cb3"]
regexTarget = "match"
regexes = ['v2PartResultId|v2QuestionId']
paths = [
  '(^|/)src/postman/postman-speaking-v2-requests\.ts$',
  '(^|/)aihub\.postman_collection\.json$',
]

[[rules.allowlists]]
description = "The Postman variable name v2GradingJobId (#1718) is the same false positive; it is scoped to the exact name and the two Postman files because its commit did not exist when the rule was written."
condition = "AND"
regexTarget = "match"
regexes = ['v2GradingJobId']
paths = [
  '(^|/)src/postman/postman-speaking-v2-requests\.ts$',
  '(^|/)aihub\.postman_collection\.json$',
]

[[rules.allowlists]]
description = "Only the documented placeholder in the production example file is allowed; real values remain detectable."
condition = "AND"
regexTarget = "match"
regexes = ['replace-with-rsa-pkcs8-private-key']
paths = ['(^|/)\.env\.production\.example$']

[[rules]]
id = "private-key"

[[rules.allowlists]]
description = "Historical sandbox assertion keys were test-only and never deployed; only their known commits and source paths are allowlisted."
condition = "AND"
commits = [
  "f9d551d60eae2afacbccb31c9fdc1e37c43bc0de",
  "1749a4aaadc03463196361637140397ec0f7f16a",
  "a6b4e79005792b05906954ed6d53391662db87d8",
]
paths = [
  '(^|/)src/modules/identity/infrastructure/sandbox-assertion\.config\.spec\.ts$',
  '(^|/)src/modules/identity/user-assertions/infrastructure/sandbox-assertion\.config\.spec\.ts$',
]

[[rules]]
id = "aihub-api-key"
description = "AIHUB API key"
regex = '''(aihub_(sk|sandbox|prod)_[A-Za-z0-9_-]{32,})([^A-Za-z0-9_-]|$)'''
secretGroup = 1
keywords = ["aihub_sk_", "aihub_sandbox_", "aihub_prod_"]
tags = ["aihub", "api-key"]

[[rules.allowlists]]
description = "The canonical auth spec and this rule's configuration contain the same public, non-credential API-key format example."
condition = "AND"
regexTarget = "secret"
regexes = ['^aihub_sk_7Kq2mXvR9wLpN4tYbZ3sHgD8fJc1AeQ6$']
paths = [
  '(^|/)docs/superpowers/specs/2026-09-07-aihub/05-auth-identity\.md$',
  '(^|/)\.gitleaks\.toml$',
]

[[rules]]
id = "vault-approle-role-id"
description = "Vault AppRole role ID"
regex = '''(?i)role[_-]?id\b\s*["']?\s*[:=]\s*["']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})([^0-9a-f-]|$)'''
secretGroup = 1
keywords = ["role_id", "ROLE_ID", "role-id", "ROLE-ID", "roleId", "RoleId", "ROLEID", "roleid"]
tags = ["vault", "approle"]

[[rules]]
id = "vault-approle-secret-id"
description = "Vault AppRole secret ID"
regex = '''(?i)secret[_-]?id\b\s*["']?\s*[:=]\s*["']?([A-Za-z0-9_-]{24,})([^A-Za-z0-9_-]|$)'''
secretGroup = 1
keywords = ["secret_id", "SECRET_ID", "secret-id", "SECRET-ID", "secretId", "SecretId", "SECRETID", "secretid"]
tags = ["vault", "approle"]
