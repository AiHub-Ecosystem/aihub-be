title = "AIHUB secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Third-party package false positives were introduced in 1a37902 and removed in 8f531d5; only that commit and path are allowlisted."
condition = "AND"
commits = ["1a37902a9925c06660e69b589d81385300395267"]
paths = ['(^|/)\.pnpm-store/']

