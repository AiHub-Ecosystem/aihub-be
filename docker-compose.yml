services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aihub
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: aihub
    ports:
      - "5432:5432"
    volumes:
      - aihub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U aihub -d aihub && psql -U aihub -d aihub -q -v ON_ERROR_STOP=1 -c 'ALTER DATABASE aihub SET aihub.test_lane_marker TO aihub_db_lane_v1' >/dev/null",
        ]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli SET aihub:test-lane:owner aihub-db-lane-v1 >/dev/null && redis-cli ping",
        ]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  aihub-postgres-data:
