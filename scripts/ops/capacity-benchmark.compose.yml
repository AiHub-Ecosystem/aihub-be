services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aihub_benchmark
      POSTGRES_USER: aihub_benchmark
      POSTGRES_PASSWORD: benchmark-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihub_benchmark -d aihub_benchmark"]
      interval: 2s
      timeout: 2s
      retries: 30
    cpus: 1.0
    mem_limit: 1024m
    networks: [benchmark]

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    cpus: 0.5
    mem_limit: 256m
    networks: [benchmark]

  benchmark-support:
    image: node:22.23.2-bookworm-slim
    command: ["node", "/work/capacity-benchmark-support.mjs"]
    environment:
      BENCHMARK_FIXTURE_ROOT: /fixtures
      BENCHMARK_REDIS_TARGET: redis:6379
      BENCHMARK_REDIS_ONE_WAY_DELAY_MS: ${BENCHMARK_REDIS_ONE_WAY_DELAY_MS:-30}
      BENCHMARK_STUB_LATENCY_MS: ${BENCHMARK_STUB_LATENCY_MS:-2000}
      BENCHMARK_STUB_ERROR_RATE: ${BENCHMARK_STUB_ERROR_RATE:-0}
    volumes:
      - ./capacity-benchmark-support.mjs:/work/capacity-benchmark-support.mjs:ro
      - ../../test/fixtures:/fixtures:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/__health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    cpus: 0.5
    mem_limit: 256m
    networks: [benchmark]

  aihub:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VCS_REF: ${BENCHMARK_VCS_REF:-local}
    entrypoint: ["node", "/benchmark/start-app.mjs"]
    volumes:
      - ./capacity-benchmark-start-app.mjs:/benchmark/start-app.mjs:ro
    environment:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: info
      AIHUB_RUNTIME_SECRET_SOURCE: env
      AIHUB_RUNTIME_DATABASE_SCOPE: production
      AIHUB_ALLOW_UNAUTHENTICATED_DEV: "false"
      AIHUB_USER_ACCESS_ISSUER: https://api.benchmark.test
      AIHUB_PRODUCTION_HOST: api.benchmark.test
      AIHUB_STAGING_HOST: staging.benchmark.test
      AIHUB_DEVELOPMENT_HOST: development.benchmark.test
      AIHUB_SANDBOX_HOST: sandbox.benchmark.test
      CUSTOMER_WEB_BASE_URL: https://customer.benchmark.test
      DATABASE_URL: postgresql://aihub_benchmark:benchmark-local-only@postgres:5432/aihub_benchmark
      REDIS_URL: redis://benchmark-support:6379
      DOWNSTREAM_AI_WRITING_URL: http://benchmark-support:8080
      DOWNSTREAM_AI_WRITING_TOKEN: benchmark-writing-token
      DOWNSTREAM_AI_SPEAKING_URL: http://benchmark-support:8080
      DOWNSTREAM_AI_SPEAKING_CLIENT_ID: benchmark-speaking-client
      DOWNSTREAM_AI_SPEAKING_SECRET_KEY: benchmark-speaking-secret
      RESEND_API_KEY: benchmark-no-send
      RESEND_FROM: "AIHUB Benchmark <benchmark@example.invalid>"
      AIHUB_WEB_SESSION_CLIENT_SECRET: benchmark-web-session-secret
      AIHUB_USER_ACCESS_JWT_KID: benchmark-user-access-2026
      AIHUB_AUTH_MFA_CURRENT_KEY_ID: benchmark-mfa-2026
      AIHUB_AUTH_MFA_KEYS: '{"benchmark-mfa-2026":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
      EMAIL_OUTBOX_CURRENT_KEY_ID: benchmark-email-2026
      EMAIL_OUTBOX_KEYS: '{"benchmark-email-2026":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}'
      AIHUB_BENCHMARK_JWT_PRIVATE_KEY_B64: ${BENCHMARK_JWT_PRIVATE_KEY_B64:?generated by capacity-benchmark.mjs}
    depends_on:
      postgres:
        condition: service_healthy
      benchmark-support:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 20s
    cpus: 1.5
    mem_limit: 768m
    networks: [benchmark]

  seed:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: build
    command: ["node", "scripts/ops/capacity-benchmark-seed.mjs"]
    environment:
      DATABASE_URL: postgresql://aihub_benchmark:benchmark-local-only@postgres:5432/aihub_benchmark
      BENCHMARK_DATA_DIR: /data
      BENCHMARK_USER_COUNT: 512
      BENCHMARK_ORGANIZATION_COUNT: 4
      BENCHMARK_USAGE_ROWS_PER_ORGANIZATION: 25000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - benchmark-data:/data
    networks: [benchmark]

  k6:
    image: grafana/k6:0.54.0
    entrypoint: ["k6"]
    command: ["run", "/scripts/capacity-benchmark-k6.js"]
    user: "0:0"
    volumes:
      - ${BENCHMARK_K6_SCRIPT_PATH:-./capacity-benchmark-k6.js}:/scripts/capacity-benchmark-k6.js:ro
      - ${BENCHMARK_UTILS_SCRIPT_PATH:-./capacity-benchmark-utils.mjs}:/scripts/capacity-benchmark-utils.mjs:ro
      - ../../test/fixtures:/fixtures:ro
      - benchmark-data:/data:ro
    networks: [benchmark]

volumes:
  benchmark-data:

networks:
  benchmark:
    internal: true
